<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj7k 谱面编辑器</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; padding: 0; }
    .ed-side .mix-row { grid-template-columns: 5.2em 3.9em minmax(80px, 1fr) 3.9em auto 3.4em; gap: 6px; }
    .ed { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 8px; padding: 10px 12px; box-sizing: border-box; }
    .ed-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .ed-top select { width: auto; max-width: 42ch; }
    .ed-top .take { color: var(--text-muted); font-size: 0.85rem; }
    .ed-main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(340px, 460px); gap: 10px; min-height: 0; }
    .ed-field { position: relative; min-height: 0; border-radius: 10px; overflow: hidden; background: #0d0a11; outline: none; }
    .ed-field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ed-field .hud { position: absolute; right: 10px; top: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; font-size: 0.8rem; color: var(--text-muted); }
    .ed-field .hud input[type=range] { width: 110px; }
    .ed-field .tools { position: absolute; left: 10px; top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
    .ed-field .tools .seg { display: flex; flex-direction: column; gap: 3px; }
    .ed-field .tools button { text-align: left; min-width: 7.5em; }
    .ed-field .tools button.on { background: var(--accent); color: #fff; border-color: transparent; }
    .ed-field .tools select { width: auto; font-size: 0.8rem; padding: 2px 4px; }
    .ed-field .editbar { position: absolute; left: 10px; bottom: 54px; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; max-width: 12em; }
    .ed-field .editbar .dirty { color: var(--accent-gold); }
    .ed-field .editbar .bad { color: var(--accent-red); }
    .ed-side { overflow: auto; min-height: 0; padding-right: 2px; }
    .ed-side .card { margin-bottom: 10px; padding: 12px 14px; }
    .ed-tl { position: relative; height: 86px; border-radius: 10px; overflow: hidden; background: rgba(12, 10, 16, 0.7); }
    .ed-tl canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
    .ed-transport { display: flex; gap: 8px; align-items: center; }
    .ed-transport > button, .ed-transport .time { flex: none; white-space: nowrap; }
    .ed-transport .time { font-family: var(--mono); font-size: 0.85rem; color: var(--text-muted); min-width: 11ch; }
    .cand { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 6px; cursor: pointer; }
    .cand.on { border-color: var(--accent); background: var(--accent-soft); }
    .cand .letter { font-weight: 800; font-size: 1.1rem; text-align: center; }
    .cand .miss { color: var(--accent-red); font-size: 0.78rem; }
    .lz { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .controls input[type=number] { width: 7.5em; }
    .controls input[type=text] { flex: 1 1 14em; }
    .controls select { width: auto; }
    .sel-line { font-size: 0.9rem; margin-bottom: 6px; }
    .job-line { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job-line.err { color: var(--accent-red); white-space: normal; }
    .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    kbd { font-family: var(--mono); font-size: 0.75rem; padding: 0 4px; border: 1px solid var(--border-color); border-radius: 3px; }
    @media (max-width: 900px) { .ed-main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } body { overflow: auto; } .ed { height: auto; } }
  </style>
</head>
<body>
  <div class="ed">
    <div class="ed-top">
      <div class="page-title" style="margin:0">谱面编辑器</div>
      <select id="projSel" title="生成项目"></select>
      <button class="small" id="openBtn" title="把任意一张 7K 谱（文件或 osu!lazer 曲库里的）建成项目来改">打开谱面…</button>
      <span class="take" id="takeLine"></span>
      <button class="small" id="undoBtn" title="退回上一版">上一版</button>
      <button class="small" id="redoBtn" title="前进到下一版">下一版</button>
      <label class="take">对照 <select id="cmpSel" title="在右边并排显示另一版"></select></label>
      <span class="grow"></span>
      <a class="standalone-only" href="/#generator">← 返回控制台</a>
    </div>
    <div class="ed-main">
      <div class="ed-field" id="field" tabindex="0">
        <canvas id="stage"></canvas>
        <div class="tools">
          <div class="seg" id="toolSeg"></div>
          <label>吸附 <select id="snapSel"></select></label>
        </div>
        <div class="editbar">
          <span id="liveLine"></span>
          <span id="dirtyLine" class="dirty"></span>
          <span id="badLine" class="bad"></span>
          <button class="small primary hidden" id="saveBtn" title="Ctrl+S">保存为新一版</button>
          <button class="small hidden" id="dropBtn">放弃手改</button>
        </div>
        <div class="hud">
          <label>流速 <input type="range" id="speed" min="2" max="40" step="1"> <span id="speedVal"></span></label>
        </div>
      </div>
      <div class="ed-side" id="side">
        <div class="empty-state" id="loading">加载中…</div>
      </div>
    </div>
    <div>
      <div class="ed-transport">
        <button class="small primary" id="playBtn">播放</button>
        <span class="time" id="timeLine">0:00.0</span>
        <span class="hint">拖时间轴或小节号选小节，拖时间轴底部段落条的分界挪动段落边界。<kbd>空格</kbd> 播放，<kbd>1</kbd>–<kbd>4</kbd> 换工具，<kbd>Ctrl+Z</kbd> 撤销手改，<kbd>H</kbd> 镜像，<kbd>←</kbd><kbd>→</kbd> 平移列，<kbd>↑</kbd><kbd>↓</kbd> 挪一格，<kbd>T</kbd> 米键/长条互换，<kbd>Ctrl+C</kbd>/<kbd>Ctrl+V</kbd> 复制到判定线。</span>
      </div>
      <div class="ed-tl" style="margin-top:6px"><canvas id="tl"></canvas></div>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
  <script>
    "use strict";
    const { el, $ } = P7;
    const fill = (box, ...kids) => box.replaceChildren(...kids.flat().filter((k) => k !== null && k !== undefined && k !== false));
    // The chart editor (ADR-0050): a chart's project drawn as the replay viewer draws a chart. Measures picked on it
    // are written again by the model (candidates played before one is adopted), or the notes are edited by hand and
    // saved as a new take; sections can be cut anew, another take shown beside it, an edit in osu!lazer read back.
    const LANE_KIND = [0, 1, 0, 2, 0, 1, 0];
    const LANE = ["#e8edf4", "#5aa9ff", "#f7c948"];
    const TINT = ["rgba(255,255,255,0.02)", "rgba(90,169,255,0.03)", "rgba(247,201,72,0.022)"];
    const LAZER_TIME_RANGE = 11485;
    const GUTTER = 58;
    const POOL_SHORT = { rc_jack: "jack", rc_tech: "tech", rc_speed: "speed", rc_stamina: "stream",
      ln_general: "ln_general", ln_tech: "ln_tech", ln_inverse: "ln_inverse", ln_release: "ln_release" };
    const LETTERS = "ABCDEFGH";
    const SNAPS = [1, 2, 3, 4, 6, 8, 12, 16];
    const TOOLS = [["select", tr("选择")], ["note", tr("米键")], ["hold", tr("长条")], ["erase", tr("删除")]];
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const lowerBound = (arr, x, f) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (f(arr[m]) < x) lo = m + 1; else hi = m; } return lo; };
    const fmtTime = (ms) => { ms = Math.max(0, ms); const s = ms / 1000; return Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
    const store = { get(k) { try { return localStorage.getItem("proj7k.editor." + k); } catch (e) { return null; } },
                    set(k, v) { try { localStorage.setItem("proj7k.editor." + k, v); } catch (e) {} } };
    const shortPools = (p) => Object.fromEntries(Object.entries(p || {}).map(([k, v]) => [POOL_SHORT[k] || k, v]));
    const keyOf = (n) => `${n.c}:${Math.round(n.t)}:${n.e == null ? "" : Math.round(n.e)}`;
    const rowsOf = (list) => list.map((n) => [n.c, Math.round(n.t), n.e == null ? null : Math.round(n.e)]);
    const sortNotes = (list) => list.sort((a, b) => a.t - b.t || a.c - b.c);

    // --- state ---------------------------------------------------------------------------------------------------
    let path = new URLSearchParams(location.search).get("project") || store.get("project") || "";
    let data = null;           // /api/editor/project
    let saved = [];            // the current take as saved: {c, t, e}
    let notes = [];            // what is being edited (the take plus hand edits not saved yet)
    let shown = [];            // what the field draws: the edits, or the take with a candidate in its stretch
    let maxLN = 0;
    let preview = null;        // the candidate being played, or null
    let sel = null;            // {first, last}: measures, from 0
    let selInfo = null;
    let picked = new Set();    // notes selected by hand (objects of `notes`)
    let history = [], future = [];
    let clipboard = null;
    let live = null;           // the last live reading of `notes`
    let problemKeys = new Set();
    let tool = store.get("tool") || "select";
    let snapDiv = Number(store.get("snap")) || 4;
    let compare = null;        // {n, notes, keys} of another take shown beside
    let now = 0, playing = false, baseT = 0, baseTs = 0, needDraw = true;
    let scroll = clamp(Number(store.get("scroll")) || 6, 2, 40);
    let busy = false, job = null;
    const audio = new Audio();
    audio.preload = "auto";
    let audioOK = false;
    audio.addEventListener("canplay", () => { audioOK = true; });
    audio.addEventListener("error", () => { audioOK = false; });

    const mix = P7.mixControl();
    const cancel = P7.cancelControl(() => job);
    const dirtyCount = () => { if (!data) return 0; const a = new Set(saved.map(keyOf)), b = new Set(notes.map(keyOf)); let n = 0; a.forEach((k) => { if (!b.has(k)) n++; }); b.forEach((k) => { if (!a.has(k)) n++; }); return n; };
    let dirty = 0;
    window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

    // --- loading -------------------------------------------------------------------------------------------------
    async function loadList() {
      const list = await P7.getJSON("/api/editor/projects").catch(() => ({ projects: [] }));
      const s = $("#projSel");
      s.replaceChildren(el("option", { value: "", text: list.projects.length ? tr("选择一个项目…") : tr("还没有项目") }),
        ...list.projects.map((p) => el("option", { value: p.path, text: `${p.name} · ${tr("{n} 版", { n: p.takes })}${p.candidates ? tr(" · 有候选") : ""}`, selected: p.path === path })));
      if (path && !list.projects.some((p) => p.path === path)) s.append(el("option", { value: path, text: path.split(/[\\/]/).pop(), selected: true }));
      if (!path && list.projects.length) path = list.projects[0].path;
      s.value = path;
      return list;
    }
    async function load(keepView) {
      if (!path) { showEmpty(tr("在「谱面生成」生成一张谱，或点「打开谱面…」把任意 7K 谱建成项目。")); return; }
      const res = await fetch(`/api/editor/project?path=${encodeURIComponent(path)}`, { cache: "no-store" });
      const d = await res.json();
      if (!res.ok || d.error) { showEmpty(d.error || tr("打不开这个项目")); return; }
      const fresh = !data || data.project_file !== d.project_file;
      data = d;
      store.set("project", path);
      saved = d.notes.map(([c, t, e]) => ({ c, t, e }));
      notes = saved.map((n) => ({ ...n }));
      picked = new Set(); history = []; future = []; live = null; problemKeys = new Set((d.problems || []).map((p) => `${p.column}:${p.time}`));
      if (preview !== null && !d.candidates[preview]) preview = null;
      if (compare && compare.n > d.takes) compare = null;
      changed(false);
      if (fresh) {
        audioOK = false;
        audio.src = `/api/editor/audio?path=${encodeURIComponent(path)}`;
        if (!keepView) { sel = null; compare = null; seek(saved.length ? Math.max(0, saved[0].t - 500) : 0); }
        mix.set(d.mix);
      }
      fillCompare();
      render();
      if (sel) refreshSel();
      rateSoon();
    }
    function rebuild() {
      let list = notes;
      const c = preview !== null && data ? data.candidates[preview] : null;
      if (c && !dirty) {
        list = saved.filter((n) => !(n.t >= c.start_ms && n.t < c.end_ms))
          .concat(c.notes_inside.map(([cc, t, e]) => ({ c: cc, t, e, cand: true })));
        sortNotes(list);
      }
      shown = list;
      maxLN = list.reduce((m, n) => Math.max(m, n.e != null ? n.e - n.t : 0), 0);
      tlDirty = true; needDraw = true;
    }
    function showEmpty(text) {
      data = null; saved = []; notes = []; shown = [];
      $("#side").replaceChildren(openCard(), el("div", { class: "empty-state", text }));
      $("#takeLine").textContent = "";
      needDraw = true; tlDirty = true;
    }

    // --- time and audio ------------------------------------------------------------------------------------------
    const duration = () => (data ? data.duration_ms : 60000);
    function rebase(t) { baseT = t; baseTs = performance.now(); }
    function seek(t) {
      now = clamp(t, 0, duration());
      rebase(now);
      if (audioOK) { try { audio.currentTime = now / 1000; } catch (e) {} }
      needDraw = true;
    }
    function play() {
      if (now >= duration() - 50) seek(0);
      playing = true; rebase(now); $("#playBtn").textContent = tr("暂停");
      if (audioOK) { audio.currentTime = now / 1000; audio.play().catch(() => {}); }
    }
    function pause() { playing = false; $("#playBtn").textContent = tr("播放"); audio.pause(); }
    const toggle = () => (playing ? pause() : play());
    $("#playBtn").onclick = toggle;

    // --- measures, beats, snapping ---------------------------------------------------------------------------------
    const bars = () => (data ? data.bars : []);
    function barAt(t) { const b = bars(); return clamp(lowerBound(b, t + 0.5, (x) => x) - 1, 0, Math.max(0, b.length - 1)); }
    function barStart(i) { const b = bars(); if (!b.length) return 0; if (i < b.length) return b[i]; const w = b.length > 1 ? b[b.length - 1] - b[b.length - 2] : 2000; return b[b.length - 1] + w * (i - b.length + 1); }
    const selSpan = () => (sel ? [barStart(sel.first), barStart(sel.last + 1)] : null);
    function pointAt(t) { const tp = data ? data.timing : []; const i = lowerBound(tp, t + 0.5, (p) => p.time) - 1; return tp.length ? tp[Math.max(0, i)] : { time: 0, beat_length: 500 }; }
    const beatAt = (t) => pointAt(t).beat_length;
    function snap(t) {
      const tp = pointAt(t), step = tp.beat_length / snapDiv;
      return Math.round(tp.time + Math.round((t - tp.time) / step) * step);
    }
    const stepAt = (t) => beatAt(t) / snapDiv;
    function sectionsIn(span) {
      if (!data || !span) return [];
      return data.sections.filter((s) => s.start_ms < span[1] && span[0] < s.end_ms).map((s) => s.index);
    }

    // --- hand edits ----------------------------------------------------------------------------------------------
    function remember() { history.push(notes.map((n) => ({ c: n.c, t: n.t, e: n.e }))); if (history.length > 300) history.shift(); future = []; }
    function restore(list) { notes = list.map((n) => ({ ...n })); picked = new Set(); changed(true); }
    function undoEdit() { if (!history.length) return; future.push(notes.map((n) => ({ ...n }))); restore(history.pop()); }
    function redoEdit() { if (!future.length) return; history.push(notes.map((n) => ({ ...n }))); restore(future.pop()); }
    function changed(rate = true) {
      sortNotes(notes);
      dirty = dirtyCount();
      if (dirty && preview !== null) preview = null;
      rebuild();
      paintEditBar();
      if (data) { renderCands(); updateButtons(); }
      if (rate) rateSoon();
    }
    function editable() { return !!data && !busy && preview === null; }
    function noteAtCell(c, t, tolMs) {
      // a head within the tolerance, else a hold covering `t`
      let best = null, bd = Infinity;
      for (let i = lowerBound(notes, t - Math.max(tolMs, maxEdit()), (n) => n.t); i < notes.length && notes[i].t <= t + tolMs; i++) {
        const n = notes[i];
        if (n.c !== c) continue;
        const d = Math.abs(n.t - t);
        if (d <= tolMs && d < bd) { best = n; bd = d; }
        else if (!best && n.e != null && n.t <= t && t <= n.e) best = n;
      }
      return best;
    }
    const maxEdit = () => notes.reduce((m, n) => Math.max(m, n.e != null ? n.e - n.t : 0), 0);
    function addNote(c, t, e) {
      const n = { c, t, e: e != null && e > t ? e : null };
      notes.push(n); return n;
    }
    function removeNotes(list) { const s = new Set(list); notes = notes.filter((n) => !s.has(n)); list.forEach((n) => picked.delete(n)); }
    function pickedList() { return notes.filter((n) => picked.has(n)); }
    function mirrorPicked() { const l = pickedList(); if (!l.length) return; remember(); l.forEach((n) => { n.c = 6 - n.c; }); changed(); }
    function shiftPicked(dc) {
      const l = pickedList(); if (!l.length) return;
      if (l.some((n) => n.c + dc < 0 || n.c + dc > 6)) return;
      remember(); l.forEach((n) => { n.c += dc; }); changed();
    }
    function nudgePicked(dir) {
      const l = pickedList(); if (!l.length) return;
      remember();
      l.forEach((n) => { const d = Math.round(stepAt(n.t)) * dir; n.t = snap(n.t + d); if (n.e != null) n.e = snap(n.e + d); });
      changed();
    }
    function togglePicked() {
      const l = pickedList(); if (!l.length) return;
      remember();
      l.forEach((n) => { n.e = n.e == null ? snap(n.t + beatAt(n.t)) : null; });
      changed();
    }
    function deletePicked() { const l = pickedList(); if (!l.length) return; remember(); removeNotes(l); changed(); }
    function copyPicked() {
      const l = pickedList(); if (!l.length) return;
      const t0 = l[0].t;
      clipboard = l.map((n) => ({ c: n.c, dt: n.t - t0, de: n.e == null ? null : n.e - t0 }));
    }
    function paste() {
      if (!clipboard || !editable()) return;
      remember();
      const t0 = snap(now);
      picked = new Set(clipboard.map((x) => addNote(x.c, t0 + x.dt, x.de == null ? null : t0 + x.de)));
      changed();
    }
    function selectAll() {
      const span = selSpan();
      picked = new Set(span ? notes.filter((n) => n.t >= span[0] && n.t < span[1]) : notes);
      needDraw = true; paintEditBar();
    }
    function dropEdits() { if (!dirty) return; remember(); restore(saved); }
    async function saveEdits() {
      if (!dirty || busy) return;
      if (live && live.problems && live.problems.length) { $("#badLine").textContent = tr("有 {n} 处音符不能玩，改好再保存", { n: live.problems.length }); return; }
      await op("edit", { notes: rowsOf(notes) }, true);
    }

    // live reading: stars, pools and what is unplayable, of the notes as they are now
    let rateTimer = null, rateSeq = 0;
    function rateSoon() { clearTimeout(rateTimer); rateTimer = setTimeout(rateNow, 350); }
    function rateNow() {
      if (!data) return;
      const span = selSpan();
      P7.send({ type: "editor_rate", request_id: `rate-${++rateSeq}`, notes: rowsOf(notes), start: span ? span[0] : null, end: span ? span[1] : null });
    }
    P7.on("editor_rated", (msg) => {
      if (msg.request_id !== `rate-${rateSeq}` || msg.error) return;
      live = msg;
      problemKeys = new Set((msg.problems || []).map((p) => `${p.column}:${p.time}`));
      if (msg.stretch && sel) { selInfo = { ...msg.stretch, start_ms: selSpan()[0], end_ms: selSpan()[1] }; mix.reference(selInfo.pools); renderSel(); }
      paintEditBar(); needDraw = true;
    });
    function paintEditBar() {
      $("#liveLine").textContent = live ? tr("整首 {stars}★ · {n} 个音符", { stars: live.stars.toFixed(2), n: live.notes }) : "";
      $("#dirtyLine").textContent = dirty ? tr("{n} 处手改未保存", { n: dirty }) : (picked.size ? tr("选中 {n} 个音符", { n: picked.size }) : "");
      const bad = live && live.problems ? live.problems.length : 0;
      $("#badLine").textContent = bad ? tr("{n} 处音符不能玩（红色）", { n: bad }) : "";
      $("#saveBtn").classList.toggle("hidden", !dirty);
      $("#dropBtn").classList.toggle("hidden", !dirty);
      $("#saveBtn").disabled = busy || bad > 0;
    }
    $("#saveBtn").onclick = saveEdits;
    $("#dropBtn").onclick = dropEdits;

    // --- tools ---------------------------------------------------------------------------------------------------
    function setTool(t) { tool = t; store.set("tool", t); paintTools(); }
    function paintTools() { $("#toolSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tool === tool)); }
    TOOLS.forEach(([k, name], i) => $("#toolSeg").append(el("button", { class: "small", "data-tool": k, text: `${i + 1} ${name}`, onclick: () => setTool(k) })));
    paintTools();
    SNAPS.forEach((d) => $("#snapSel").append(el("option", { value: String(d), text: `1/${d}`, selected: d === snapDiv })));
    $("#snapSel").onchange = () => { snapDiv = Number($("#snapSel").value); store.set("snap", snapDiv); needDraw = true; };

    // --- the field -----------------------------------------------------------------------------------------------
    const stage = $("#stage"), sctx = stage.getContext("2d", { alpha: false });
    let dpr = 1;
    const sizes = new Map();
    function measure(cv) {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = cv.getBoundingClientRect();

      if (!editable()) return;
      if (["1", "2", "3", "4"].includes(e.key)) { setTool(TOOLS[Number(e.key) - 1][0]); return; }
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deletePicked(); return; }
      if (k === "h") { mirrorPicked(); return; }
      if (k === "t") { togglePicked(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); shiftPicked(-1); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); shiftPicked(1); return; }
      if (e.key === "ArrowUp" && picked.size) { e.preventDefault(); nudgePicked(1); return; }
      if (e.key === "ArrowDown" && picked.size) { e.preventDefault(); nudgePicked(-1); return; }
    });
    function syncSpeed() { $("#speed").value = String(scroll); $("#speedVal").textContent = String(scroll); store.set("scroll", scroll); needDraw = true; tlDirty = true; }
    $("#speed").addEventListener("input", () => { scroll = Number($("#speed").value); syncSpeed(); });
    syncSpeed();

    // --- comparing with another take -----------------------------------------------------------------------------
    function fillCompare() {
      const s = $("#cmpSel");
      s.replaceChildren(el("option", { value: "", text: tr("不对照") }),
        ...(data ? data.take_list : []).map((t) => el("option", { value: String(t.n), text: tr("第 {n} 版 · {note}", { n: t.n, note: t.note }), selected: compare && compare.n === t.n })));
    }
    $("#cmpSel").onchange = async () => {
      const n = Number($("#cmpSel").value);
      if (!n || !data) { compare = null; needDraw = true; return; }
      const d = await P7.getJSON(`/api/editor/take?path=${encodeURIComponent(path)}&n=${n}`).catch(() => null);
      if (!d || d.error) return;
      const list = d.notes.map(([c, t, e]) => ({ c, t, e }));
      compare = { n, notes: list, keys: new Set(list.map(keyOf)) };
      needDraw = true;
    };

    // --- the side panel ------------------------------------------------------------------------------------------
    let selSeq = 0;
    async function refreshSel() {
      if (!data || !sel) { selInfo = null; renderSel(); return; }
      if (dirty) { rateNow(); return; }       // the live reading covers the selection of unsaved notes
      const span = selSpan(), seq = ++selSeq;
      selInfo = null; renderSel();
      const info = await P7.getJSON(`/api/editor/stretch?path=${encodeURIComponent(path)}&start=${span[0]}&end=${span[1]}`).catch(() => null);
      if (seq !== selSeq || !info || info.error) return;
      selInfo = info;
      mix.reference(info.pools);
      renderSel();
    }
    const selBox = el("div");
    function renderSel() {
      if (!data) return;
      if (!sel) {
        fill(selBox, el("div", { class: "hint", text: tr("还没有选区：在时间轴或谱面左侧的小节号上拖动。") }));
        updateButtons(); needDraw = true; return;
      }
      const span = selSpan();
      const secs = sectionsIn(span);
      const parts = [el("div", { class: "sel-line" },
        el("b", { text: tr("第 {a}–{b} 小节", { a: sel.first + 1, b: sel.last + 1 }) }),
        ` · ${fmtTime(span[0])}–${fmtTime(span[1])} · ${tr("段 {list}", { list: secs.map((i) => i + 1).join(", ") || "—" })}`)];
      if (selInfo) {
        parts.push(el("div", { class: "hint", text: tr("{n} 个音符，{stars}★，长条 {ln}%", { n: selInfo.notes, stars: selInfo.stars.toFixed(2), ln: Math.round(selInfo.ln_share * 100) }) }));
        if (selInfo.notes) parts.push(P7.skillBars(shortPools(selInfo.pools)));
      } else parts.push(el("div", { class: "hint", text: tr("计算中…") }));
      fill(selBox, ...parts);
      if (selInfo && $("#target") && !$("#target").value) $("#target").placeholder = selInfo.stars ? selInfo.stars.toFixed(2) : tr("不变");
      updateButtons(); needDraw = true;
    }

    const jobLine = el("div", { class: "job-line" });
    const candBox = el("div");
    const secBox = el("div");
    const lazerBox = el("div");
    let openShown = false;
    function openCard() {
      const input = el("input", { type: "text", id: "openSpec", placeholder: tr(".osu 文件路径、谱面 ID 或链接") });
      const game = el("button", { class: "small", text: tr("用游戏当前谱面"), onclick: () => {
        P7.onGameChart((s) => { if (s && s.chart) input.value = s.chart.md5_hash; });
      } });
      return el("div", { class: `card${openShown ? "" : " hidden"}`, id: "openCard" }, el("h2", { text: tr("打开一张谱") }),
        el("div", { class: "hint", text: tr("把任意一张 7K 谱（官方谱也行）复制成一个项目来改，原谱不动。复制件导入 osu! 是一张新谱，不会覆盖原来的。") }),
        el("div", { class: "controls" }, input, game,
          el("button", { class: "small primary", text: tr("打开"), onclick: () => openChart(input.value) })),
        el("div", { class: "job-line", id: "openLine" }));
    }
    $("#openBtn").onclick = () => {
      openShown = !openShown;
      const c = $("#openCard");
      if (c) c.classList.toggle("hidden", !openShown);
      else $("#side").prepend(openCard());
    };
    async function openChart(spec) {
      if (!spec.trim() || busy) return;
      if (dirty && !confirm(tr("有手改没保存，打开别的谱会丢掉它们。继续吗？"))) return;
      busy = true; updateButtons();
      const line = $("#openLine");
      line.className = "job-line"; line.textContent = tr("提交中");
      const done = await P7.startJob("editor_open", { chart: spec.trim() }, { onLog: (l) => { line.textContent = l; } });
      busy = false;
      if (done.status !== "done") { line.className = "job-line err"; line.textContent = done.error || P7.statusText(done); updateButtons(); return; }
      line.textContent = "";
      path = done.result.project_file; data = null; sel = null; preview = null; compare = null;
      await loadList(); await load();
    }

    function render() {
      if (!data) return;
      const t = data.take;
      $("#takeLine").textContent = tr("第 {n}/{total} 版 · {note} · {stars}★", { n: t.n, total: data.takes, note: t.note, stars: t.stars.toFixed(2) });
      const side = $("#side");
      if (!side.querySelector("#rewriteCard")) {
        side.replaceChildren(
          openCard(),
          el("div", { class: "card" }, el("h2", { text: tr("选区") }), selBox),
          el("div", { class: "card", id: "rewriteCard" }, el("h2", { text: tr("让模型重写选区") }),
            el("div", { class: "controls" },
              el("label", { class: "check" }, tr("目标星级"), el("input", { type: "number", id: "target", step: "0.1", min: "0.5", placeholder: tr("不变") })),
              el("label", { class: "check" }, tr("候选数"), el("input", { type: "number", id: "cands", step: "1", min: "1", max: "8", value: "3" })),
              el("label", { class: "check" }, tr("长条比例"), el("input", { type: "number", id: "lnRatio", step: "0.05", min: "0", max: "1", placeholder: tr("照生成时") }))),
            el("div", { class: "hint", style: "margin:8px 0 4px", text: tr("技法难度范围（这段自己的引擎星级；金线是选区现在的值）") }),
            mix.node,
            el("div", { class: "controls" },
              el("button", { class: "primary", id: "rewriteBtn", text: tr("重写所选（出候选试听）"), onclick: rewrite }), cancel.node),
            jobLine,
            el("div", { class: "hint", style: "margin-top:6px", text: tr("每个候选在 meow 的显卡上约 1–4 分钟。候选按「星级贴近目标 + 接缝顺 + 技法在范围内」排好，点一个就能在谱面上看、从选区前一小节开始听，满意再采用。模型不听技法指令，范围只能靠挑：达不到的会标红。手改过的小节（绿色）不会被重写。") })),
          el("div", { class: "card hidden", id: "candCard" }, el("h2", { text: tr("候选") }), candBox),
          el("div", { class: "card" }, el("h2", { text: tr("段落") }), secBox),
          el("div", { class: "card" }, el("h2", { text: tr("osu!lazer 编辑器") }), lazerBox),
          el("div", { class: "card" }, el("h2", { text: tr("手改") }),
            el("div", { class: "hint", text: tr("在谱面上直接改：选择工具点音符选中、拖动移动、拖长条尾巴改长度、拖空白框选；米键工具点空位放、点音符删；长条工具按住拖出长条；删除工具点或拖过去删（右键也是删）。改完点左下角「保存为新一版」，手改过的小节自动标绿，之后的模型重写不会动它们（解锁所在段可放开）。") }),
            el("div", { class: "legend" },
              el("span", {}, el("i", { style: "background:#ffcc22" }), tr("锁定")),
              el("span", {}, el("i", { style: "background:#aa88ff" }), tr("锚定")),
              el("span", {}, el("i", { style: "background:#8fd44f" }), tr("手改 / 对照时多出的")),
              el("span", {}, el("i", { style: "background:#ff6680" }), tr("对照时少了的")),
              el("span", {}, el("i", { style: "background:#ff4d6d" }), tr("不能玩")))));
      }
      renderSel(); renderCands(); renderSections(); renderLazer(); updateButtons(); paintEditBar();
    }
    function renderCands() {
      if (!data || !$("#candCard")) return;
      const cs = data.candidates || [];
      $("#candCard").classList.toggle("hidden", !cs.length);
      if (!cs.length) { fill(candBox, ); return; }
      const row = (k) => {
        const c = cs[k];
        const misses = (c.misses || []).map((m) => tr("{name} 要 {want}，实际 {stars}★", { name: poolName(m.pool), want: rangeText(m.low, m.high), stars: m.stars.toFixed(2) }));
        return el("div", { class: `cand${preview === k ? " on" : ""}`, onclick: () => setPreview(k, true) },
          el("span", { class: "letter", text: LETTERS[k] }),
          el("div", {},
            el("div", { text: tr("{stars}★（目标 {target}★）· 接缝 {seam} · {n} 个音符", { stars: c.stars.toFixed(2), target: c.target.toFixed(2), seam: c.seam.toFixed(2), n: c.notes }) }),
            misses.length ? el("div", { class: "miss", text: misses.join(tr("；")) }) : null),
          el("button", { class: "small primary", text: tr("采用"), disabled: busy || !!dirty, onclick: (e) => { e.stopPropagation(); op("adopt", { candidate: k + 1 }); } }));
      };
      const first = cs[0];
      fill(candBox, 
        el("div", { class: "hint", style: "margin-bottom:6px", text: tr("第 {a}–{b} 秒，基于第 {n} 版。", { a: (first.start_ms / 1000).toFixed(1), b: (first.end_ms / 1000).toFixed(1), n: first.base + 1 }) }),
        dirty ? el("div", { class: "warn", text: tr("有手改没保存：先保存或放弃，才能看候选") }) : null,
        ...cs.map((_, k) => row(k)),
        el("div", { class: "controls" },
          el("button", { class: "small", text: tr("看原版"), disabled: preview === null, onclick: () => setPreview(null, true) }),
          el("button", { class: "small danger", text: tr("全部放弃"), disabled: busy, onclick: () => op("discard", {}) })));
    }
    function setPreview(k, listen) {
      if (dirty && k !== null) return;
      preview = k; picked = new Set(); rebuild(); renderCands();
      const c = data.candidates[k === null ? 0 : k];
      if (listen && c) {
        const before = barStart(Math.max(0, barAt(c.start_ms) - 1));
        const g = geometry();
        seek(before - 0.05 * (g.lineY / g.ppm)); if (!playing) play();
      }
    }
    function renderSections() {
      if (!data) return;
      const span = selSpan();
      const secs = sectionsIn(span);
      const none = !secs.length;
      const off = busy || !!dirty;
      const source = el("select", { id: "anchorSrc" }, ...data.sections.map((s) => el("option", { value: String(s.index + 1), text: tr("第 {n} 段", { n: s.index + 1 }) })));
      const mirror = el("input", { type: "checkbox" });
      const list = secs.map((i) => i + 1).join(",");
      const states = data.sections.filter((s) => s.locked || s.anchor !== null || s.hand).map((s) => {
        const parts = [];
        if (s.locked) parts.push(tr("第 {n} 段锁定", { n: s.index + 1 }));
        if (s.anchor !== null) parts.push(s.mirror ? tr("第 {n} 段镜像第 {m} 段", { n: s.index + 1, m: s.anchor + 1 }) : tr("第 {n} 段同第 {m} 段", { n: s.index + 1, m: s.anchor + 1 }));
        if (s.hand) parts.push(tr("第 {n} 段有 {k} 个手改小节", { n: s.index + 1, k: s.hand }));
        return parts.join(tr("，"));
      });
      // the section holding the selection's first measure: where a split or a boundary move lands
      const at = sel ? data.sections.find((s) => s.bars[0] - 1 <= sel.first && sel.first <= s.bars[1] - 1) : null;
      const canSplit = at && sel.first > at.bars[0] - 1;
      fill(secBox, 
        el("div", { class: "hint", text: none ? tr("选区碰到的段可以锁定或锚定到另一段。") : tr("选区碰到第 {list} 段。", { list }) }),
        el("div", { class: "controls" },
          el("button", { class: "small", text: tr("锁定所选"), disabled: off || none, onclick: () => op("lock", { sections: list }) }),
          el("button", { class: "small", text: tr("解锁所选"), disabled: off || none, onclick: () => op("unlock", { sections: list }) }),
          el("button", { class: "small", text: tr("所选锚定到"), disabled: off || none, onclick: () => op("anchor", { sections: list, source: source.value, mirror: mirror.checked }) }),
          source, el("label", { class: "check" }, mirror, tr("镜像")),
          el("button", { class: "small", text: tr("解开锚定"), disabled: off || none, onclick: () => op("unanchor", { sections: list }) })),
        el("div", { class: "controls" },
          el("button", { class: "small", text: tr("从选区起点拆开"), disabled: off || !canSplit, title: tr("所在的段从选区第一个小节起拆成两段"),
            onclick: () => op("split", { section: at.index + 1, bar: sel.first + 1 }) }),
          el("button", { class: "small", text: tr("和下一段合并"), disabled: off || none || secs[0] + 1 >= data.sections.length,
            onclick: () => op("merge", { section: secs[0] + 1 }) })),
        el("div", { class: "hint", style: "margin-top:6px", text: tr("也可以在下方时间轴的段落条上拖动分界线来挪动段落边界。") }),
        states.length ? el("div", { class: "hint", style: "margin-top:6px", text: states.join(tr("；")) }) : null);
    }
    let lazerList = null, lazerErr = null;
    function renderLazer() {
      const find = el("button", { class: "small", text: tr("查找 osu!lazer 里改过的版本"), disabled: busy || !!dirty, onclick: findLazer });
      const rows = (lazerList || []).map((c) => el("div", { class: "lz" },
        el("div", {}, el("div", { text: c.version }),
          el("div", { class: "hint", text: c.edited ? tr("在 lazer 里改过") : tr("和第 {n} 版一样", { n: c.take }) })),
        el("button", { class: `small${c.edited ? " primary" : ""}`, text: tr("读回"), disabled: busy || !!dirty || !c.edited,
          onclick: () => op("readback", { md5: c.md5 }) })));
      fill(lazerBox, 
        el("div", { class: "hint", text: tr("把某一版的 .osz 导入 osu!lazer，在它的编辑器里改完保存，再回这里读回：读回的谱成为新一版，改过的小节标成手改。") }),
        el("div", { class: "controls" }, find),
        lazerErr ? el("div", { class: "job-line err", text: lazerErr }) : null,
        lazerList && !lazerList.length && !lazerErr ? el("div", { class: "hint", text: tr("osu!lazer 曲库里没找到这个项目的谱（先导入一版的 .osz）。") }) : null,
        ...rows);
    }
    async function findLazer() {
      lazerList = null; lazerErr = null; renderLazer();
      const d = await P7.getJSON(`/api/editor/lazer?path=${encodeURIComponent(path)}`).catch((e) => ({ error: String(e) }));
      lazerList = d.charts || [];
      lazerErr = d.error && !lazerList.length ? String(d.error).split("\n")[0] : null;
      renderLazer();
    }
    function updateButtons() {
      const b = $("#rewriteBtn");
      if (b) { b.disabled = busy || !sel || !!dirty; b.title = dirty ? tr("有手改没保存：先保存或放弃") : ""; }
      $("#undoBtn").disabled = busy || !!dirty || !data || !data.can_undo;
      $("#redoBtn").disabled = busy || !!dirty || !data || !data.can_redo;
    }
    const poolName = (k) => (P7.MIX_POOLS.find((p) => p[0] === k) || [k, k])[1];
    function rangeText(lo, hi) {
      if (lo !== null && hi !== null) return `${lo}–${hi}★`;
      return lo !== null ? `≥ ${lo}★` : `≤ ${hi}★`;
    }

    // --- operations (jobs) ---------------------------------------------------------------------------------------
    async function op(name, extra, editing) {
      if (busy || !data) return;
      if (dirty && !editing) { jobLine.className = "job-line err"; jobLine.textContent = tr("有手改没保存：先保存或放弃"); return; }
      busy = true; updateButtons(); renderCands(); renderSections(); paintEditBar();
      jobLine.className = "job-line"; jobLine.textContent = tr("提交中");
      job = null; cancel.update(null);
      const done = await P7.startJob("generator_project", { project: data.project_file, op: name, ...extra }, {
        onUpdate: (j) => { job = j; cancel.update(j); if (j.status !== "running") jobLine.textContent = P7.statusText(j); },
        onLog: (line) => { jobLine.textContent = line; },
      });
      job = done; cancel.update(done);
      busy = false;
      if (done.status !== "done") {
        jobLine.className = "job-line err";
        jobLine.textContent = done.error || P7.statusText(done);
        if (editing) { $("#badLine").textContent = done.error || ""; paintEditBar(); updateButtons(); return; }
      } else {
        jobLine.textContent = "";
        if (name === "adopt" || name === "discard") preview = null;
        if (name === "readback") lazerList = null;
      }
      await load(true);
      await loadList();
      if (name === "rewrite" && data && data.candidates.length) setPreview(0, true);
      updateButtons();
    }
    function rewrite() {
      if (!sel) return;
      let m;
      try { m = mix.value(); } catch (e) { jobLine.className = "job-line err"; jobLine.textContent = e.message; return; }
      op("rewrite", { bars: `${sel.first + 1}-${sel.last + 1}`, audition: true, target_sr: $("#target").value,
        candidates: $("#cands").value, ln_ratio: $("#lnRatio").value, mix: m });
    }
    $("#undoBtn").onclick = () => op("undo", {});
    $("#redoBtn").onclick = () => op("redo", {});
    function switchTo(p) {
      if (dirty && !confirm(tr("有手改没保存，换项目会丢掉它们。继续吗？"))) { $("#projSel").value = path; return; }
      path = p; preview = null; sel = null; data = null; compare = null; dirty = 0; load();
    }
    $("#projSel").onchange = () => switchTo($("#projSel").value);
    P7.onNav((params) => { if (params.project && params.project !== path) loadList().then(() => switchTo(params.project)); });

    // --- the clock -----------------------------------------------------------------------------------------------
    function frame() {
      if (playing) {
        let t = baseT + (performance.now() - baseTs);
        if (audioOK && !audio.paused) {
          const a = audio.currentTime * 1000;
          if (Math.abs(a - t) > 80) { rebase(a); t = a; } else { baseT += (a - t) * 0.05; t = baseT + (performance.now() - baseTs); }
        }
        now = t;
        if (now >= duration()) { now = duration(); pause(); }
        needDraw = true;
      }
      if (needDraw) {
        needDraw = false;
        drawStage(); drawTimeline();
        $("#timeLine").textContent = `${fmtTime(now)} / ${fmtTime(duration())}`;
      }
      requestAnimationFrame(frame);
    }
    window.__editor = {
      seek, setSel: (a, b) => { setSel(a, b); finishSel(); }, setPreview, setTool, snap,
      get data() { return data; }, get sel() { return sel; }, get notes() { return notes; }, get dirty() { return dirty; },
      get live() { return live; }, geometry, pick: (list) => { picked = new Set(list); needDraw = true; paintEditBar(); },
    };
    loadList().then(() => load());
    requestAnimationFrame(frame);
  </script>
</body>
</html>
