<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj7k 控制台</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    html, body { height: 100%; }
    body { padding: 0; display: flex; overflow: hidden; }
    /* The side bar: the player's pages, then the tools, then the game's state at the foot. */
    .side {
      width: 224px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 12px;
      background: var(--bg-side); border-right: 1px solid var(--border-color); overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.02em; }
    .brand .logo {
      width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center;
      background: var(--accent); color: #fff; font-size: 0.8rem; font-weight: 900;
    }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav .group { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; padding: 12px 10px 4px; }
    .nav a {
      position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-muted);
      font-weight: 600; padding: 8px 10px; border-radius: 8px;
    }
    .nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav a:hover { color: var(--text-main); background: var(--bg-hover); }
    .nav a.active { color: var(--text-main); background: var(--accent-soft); }
    .nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .nav a.active svg { color: var(--accent); }
    .nav .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
    .game {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem;
    }
    .game-head { display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
    .game-head .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; flex: none; }
    .dot.on { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .dot.warn { background: var(--accent-gold); }
    .dot.off { background: var(--accent-red); }
    .game-state { color: var(--text-main); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .game-state:empty { display: none; }
    #gameState { cursor: pointer; }
    #gameState:hover { color: var(--accent); }
    #jobState:empty { display: none; }
    #jobState { color: var(--accent-blue); }
    .foot-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-muted); padding: 0 4px; }
    .foot-row .grow { flex: 1; }
    #playerSel { padding: 4px 8px; font-size: 0.8rem; }
    .frames { flex: 1; position: relative; min-width: 0; }
    .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg-dark); }
    @keyframes p7-page { from { opacity: 0; transform: translateY(12px) scale(0.995); } to { opacity: 1; transform: none; } }
    @keyframes p7-slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes p7-shade { from { opacity: 0; } to { opacity: 1; } }
    .frames iframe.enter { animation: p7-page 0.32s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .drawer:not(.hidden) { animation: p7-slide 0.28s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .drawer-shade:not(.hidden) { animation: p7-shade 0.2s ease-out; }
    .nav a, .nav a svg { transition: background 0.18s, color 0.18s; }
    .nav a.active::before { animation: p7-shade 0.25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .frames iframe.enter, .drawer, .drawer-shade, .nav a.active::before { animation: none !important; } }
    /* A narrow window keeps the icons only; their names show on hover. */
    @media (max-width: 1080px) {
      .side { width: 64px; padding: 14px 8px 10px; align-items: center; }
      .brand { padding: 2px 0 12px; }
      .brand .name, .nav .label, .nav .group, .game, .foot-row .grow, #connText, #playerSel { display: none !important; }
      .nav .group + a { margin-top: 14px; }
      .nav a { padding: 9px; justify-content: center; }
      .nav a.active::before { left: -8px; }
      .foot-row { flex-direction: column; padding: 0; }
      #langBtn { padding: 3px 6px; font-size: 0.7rem; }
    }
    /* Chart and play details open in a panel over the page that opened them, so the list stays where it was. */
    .drawer-shade { position: absolute; inset: 0; background: rgba(4, 6, 10, 0.6); z-index: 10; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(880px, 100%); z-index: 11;
      background: var(--bg-dark); border-left: 1px solid var(--border-color); box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column;
    }
    .drawer-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border-color); }
    .drawer-head .grow { flex: 1; color: var(--text-muted); font-size: 0.82rem; }
    .drawer iframe { flex: 1; width: 100%; border: 0; background: var(--bg-dark); }
  </style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="logo">7K</span><span class="name">proj7k</span></div>
    <nav class="nav" id="nav">
      <span class="group">玩家</span>
      <a href="#home" data-page="home" title="主页"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="label">主页</span></a>
      <a href="#history" data-page="history" title="游玩记录"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">游玩记录</span></a>
      <a href="#library" data-page="library" title="曲库"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="label">曲库</span></a>
      <span class="group">工具</span>
      <a href="#live" data-page="live" title="实时雷达"><svg viewBox="0 0 24 24"><path d="M12 3 21 9.5 17.5 20h-11L3 9.5z"/><path d="M12 8l4 3-1.5 5h-5L8 11z"/></svg><span class="label">实时雷达</span></a>
      <a href="#profiler" data-page="profiler" title="回放与画像"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="label" data-en="Replays">回放与画像</span></a>
      <a href="#downscaler" data-page="downscaler" title="降阶练习"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h4"/><path d="M18 5v14m-3-3 3 3 3-3"/></svg><span class="label">降阶练习</span></a>
      <a href="#generator" data-page="generator" title="谱面生成"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg><span class="label" data-en="Generator">谱面生成</span></a>
      <span class="group">设置</span>
      <a href="#sync" data-page="sync" title="曲库同步"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg><span class="label" data-en="Sync">曲库同步</span></a>
    </nav>
    <div class="side-foot">
      <select id="playerSel" class="hidden" title="看哪位玩家的主页和记录"></select>
      <div class="game">
        <div class="game-head"><span class="dot" id="lazerDot"></span><span class="grow" id="lazerState" title="osu!lazer 数据库状态"></span></div>
        <span id="gameState" class="game-state" title="osu!lazer 里当前选中的谱面"></span>
        <span id="jobState"></span>
        <button class="small" id="lazerBtn" title="关闭 osu!lazer（和点窗口的 ✕ 一样，游戏会正常保存后退出）再重新打开；没在运行就直接打开">重启 osu!</button>
      </div>
      <div class="foot-row">
        <span class="dot" id="connDot" title="和看板的连接"></span><span class="grow" id="connText">未连接</span>
        <button class="small" id="langBtn" title="切换语言 / Switch language"></button>
      </div>
    </div>
  </aside>
  <div class="frames" id="frames">
    <div class="drawer-shade hidden" id="shade"></div>
    <div class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <button class="small" id="drawerBack" title="上一个">←</button>
        <span class="grow" id="drawerTitle"></span>
        <button class="small" id="drawerClose" title="关闭（Esc）">✕ 关闭</button>
      </div>
      <iframe id="drawerFrame" title="详情"></iframe>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
  <script>
    "use strict";
    // Each tool is its own page, loaded once and kept alive while hidden: the live radar keeps following the
    // game and a running job keeps streaming while another tab is open.
    const PAGES = {
      home: "/home", history: "/history", library: "/library",
      live: "/live", sync: "/sync", downscaler: "/downscaler", generator: "/generator", profiler: "/profiler",
    };
    const PLAYER_PAGES = ["home", "history", "library"];
    const frames = {};
    const ready = new Set();   // frames whose page has loaded and listens for parameters
    const pending = {};        // page -> parameters waiting for it to load
    let player = "";
    let current = null;        // the page in front

    function pageSrc(name) {
      return PLAYER_PAGES.includes(name) && player ? `${PAGES[name]}?player=${encodeURIComponent(player)}` : PAGES[name];
    }
    function show(name, params) {
      if (!(name in PAGES)) name = "home";
      if (!frames[name]) {
        frames[name] = P7.el("iframe", { src: pageSrc(name), title: name });
        document.getElementById("frames").prepend(frames[name]);
      }
      for (const [k, f] of Object.entries(frames)) f.style.visibility = k === name ? "visible" : "hidden";
      // The page coming forward fades and slides in; restarting the class replays it on every switch.
      if (name !== current) { const f = frames[name]; f.classList.remove("enter"); void f.offsetWidth; f.classList.add("enter"); current = name; }
      document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.page === name));
      document.title = `proj7k · ${document.querySelector(`#nav a[data-page="${name}"] .label`).textContent}`;
      if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
      if (params && Object.keys(params).length) {
        if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "params", params }, location.origin);
        else pending[name] = params;
      }
    }
    window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    show(location.hash.slice(1));
    // Coming back to the window (from the game) refreshes the page in front: a play just set shows up.
    document.addEventListener("visibilitychange", () => {
      const f = frames[location.hash.slice(1) || "home"];
      if (!document.hidden && f && ready.has(f)) f.contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
    });

    // --- detail panel: a chart or a play, opened from any page ---------------------------------------------------
    const drawer = document.getElementById("drawer");
    const drawerFrame = document.getElementById("drawerFrame");
    const stack = [];
    const DETAIL_TITLE = { chart: tr("谱面"), play: tr("单局成绩") };
    function openDetail(page, params) {
      const src = `/${page}?${new URLSearchParams({ ...params, ...(player ? { player } : {}) })}`;
      if (stack[stack.length - 1] !== src) stack.push(src);
      loadDetail();
    }
    function loadDetail() {
      const src = stack[stack.length - 1];
      if (!src) return closeDetail();
      drawerFrame.src = src;
      document.getElementById("drawerTitle").textContent = DETAIL_TITLE[src.slice(1).split("?")[0]] || "";
      document.getElementById("drawerBack").disabled = stack.length < 2;
      drawer.classList.remove("hidden");
      document.getElementById("shade").classList.remove("hidden");
    }
    function closeDetail() {
      stack.length = 0;
      drawer.classList.add("hidden");
      document.getElementById("shade").classList.add("hidden");
      drawerFrame.src = "about:blank";
    }
    document.getElementById("drawerClose").onclick = closeDetail;
    document.getElementById("shade").onclick = closeDetail;
    document.getElementById("drawerBack").onclick = () => { stack.pop(); loadDetail(); };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin || !e.data || !e.data.p7) return;
      const msg = e.data;
      if (msg.kind === "ready") {
        const name = Object.keys(frames).find((k) => frames[k].contentWindow === e.source);
        if (!name) return;
        ready.add(frames[name]);
        if (pending[name]) { frames[name].contentWindow.postMessage({ p7: true, kind: "params", params: pending[name] }, location.origin); delete pending[name]; }
      } else if (msg.kind === "nav") {
        closeDetail();
        if (location.hash.slice(1) !== msg.page) history.replaceState(null, "", `#${msg.page}`);
        show(msg.page, msg.params);
      } else if (msg.kind === "detail") {
        openDetail(msg.page, msg.params);
      }
    });
    document.getElementById("gameState").onclick = () => { if (gameMd5) openDetail("chart", { md5: gameMd5 }); };

    // --- whose pages: the library's own player unless another is picked --------------------------------------------
    async function loadPlayers() {
      let data;
      try { data = await P7.getJSON("/api/me/players"); } catch (e) { return; }
      const sel = document.getElementById("playerSel");
      const players = data.players || [];
      sel.replaceChildren(...players.map((p) => P7.el("option", { value: p.name, text: tr("{name}（{n} 局）", { name: p.name, n: p.plays }) })));
      sel.classList.toggle("hidden", players.length < 2);
      player = data.default || "";
      sel.value = player;
    }
    document.getElementById("playerSel").onchange = (e) => {
      player = e.target.value;
      PLAYER_PAGES.forEach((k) => { if (frames[k]) { ready.delete(frames[k]); frames[k].src = pageSrc(k); } });
    };
    loadPlayers();

    P7.on("connection", (up) => {
      document.getElementById("connDot").className = `dot ${up ? "on" : "off"}`;
      document.getElementById("connText").textContent = up ? tr("已连接") : tr("未连接");
      if (up) P7.send({ type: "jobs_list" });
    });

    const active = new Map();
    function renderJobs() {
      const running = [...active.values()].filter((j) => j.status === "running").length;
      const queued = [...active.values()].filter((j) => j.status === "queued").length;
      document.getElementById("jobState").textContent =
        running || queued ? tr("任务：{n} 运行中", { n: running }) + (queued ? tr("，{n} 排队", { n: queued }) : "") : "";
    }
    P7.on("jobs", (msg) => { active.clear(); msg.jobs.forEach((j) => { if (j.status === "queued" || j.status === "running") active.set(j.id, j); }); renderJobs(); });
    P7.on("job_update", (msg) => {
      const j = msg.job;
      if (j.status === "queued" || j.status === "running") active.set(j.id, j); else active.delete(j.id);
      renderJobs();
      if (!["queued", "running"].includes(j.status) && (j.kind.startsWith("sync") || j.kind === "lazer_control")) refreshLazer();
    });

    // The game's current chart, which the downscaler, generator and profiler pages preselect.
    let gameMd5 = null;
    P7.onGameChart((state) => {
      const node = document.getElementById("gameState");
      const c = state.chart;
      gameMd5 = c ? c.md5_hash : null;
      node.textContent = c ? `♪ ${c.title} [${c.version}] · ${Number(c.star_rating).toFixed(2)}★ ${c.dan_tier || ""}` : "";
      node.title = c ? tr("osu!lazer 当前谱面：{chart}（点击查看详情）", { chart: P7.chartName(c) }) : tr("osu!lazer 里当前选中的谱面");
    });

    async function refreshLazer() {
      const node = document.getElementById("lazerState");
      try {
        const cfg = await P7.getJSON("/api/config");
        node.textContent = !cfg.realm_exists ? tr("未找到 osu!lazer 数据库")
          : cfg.lazer_running ? tr("osu!lazer 运行中（数据库锁定）") : tr("osu!lazer 未运行");
        document.getElementById("lazerDot").className = `dot ${!cfg.realm_exists ? "warn" : cfg.lazer_running ? "on" : ""}`;
      } catch (e) { node.textContent = ""; }
    }
    document.getElementById("lazerBtn").onclick = async () => {
      const btn = document.getElementById("lazerBtn");
      const node = document.getElementById("lazerState");
      btn.disabled = true;
      node.textContent = tr("正在重启 osu!lazer…");
      const job = await P7.startJob("lazer_control", { mode: "restart" });
      btn.disabled = false;
      if (job.status === "failed") alert(tr("重启 osu!lazer 失败：{error}", { error: job.error }));
      refreshLazer();
    };

    // The other language, named in itself; switching reloads the shell and every page in it.
    const langBtn = document.getElementById("langBtn");
    langBtn.textContent = P7I18N.lang === "en" ? "\u4e2d\u6587" : "English";
    langBtn.onclick = () => {
      if (active.size && !confirm(tr("切换语言会重新载入所有页面：正在运行的任务会在后台继续跑完，但页面上不再显示它的进度。继续吗？"))) return;
      P7I18N.remember(P7I18N.lang === "en" ? "zh" : "en");
      location.reload();
    };

    // Probed on load and after each sync job only: the probe takes osu!lazer's lock for an instant.
    refreshLazer();
  </script>
</body>
</html>
