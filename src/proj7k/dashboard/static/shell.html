<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj7k 控制台</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    html, body { height: 100%; }
    body { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: 10px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);
    }
    .brand {
      font-size: 1.15rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a {
      text-decoration: none; color: var(--text-muted); font-weight: 600; padding: 6px 14px; border-radius: 8px;
      border: 1px solid transparent;
    }
    .nav a:hover { color: var(--text-main); }
    .nav a.active { color: var(--text-main); border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.12); }
    .status { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 0.8rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); display: inline-block; margin-right: 6px; }
    .dot.on { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .game-state { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
    .frames { flex: 1; position: relative; }
    .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg-dark); }
    .nav .sep { width: 1px; background: var(--border-color); margin: 4px 6px; }
    #playerSel { width: auto; padding: 3px 8px; font-size: 0.8rem; }
    #gameState { cursor: pointer; }
    #gameState:hover { color: var(--accent-blue); }
    /* Chart and play details open in a panel over the page that opened them, so the list stays where it was. */
    .drawer-shade { position: absolute; inset: 0; background: rgba(2, 6, 14, 0.55); z-index: 10; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(880px, 100%); z-index: 11;
      background: var(--bg-dark); border-left: 1px solid var(--border-color); box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column;
    }
    .drawer-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border-color); }
    .drawer-head .grow { flex: 1; color: var(--text-muted); font-size: 0.82rem; }
    .drawer iframe { flex: 1; width: 100%; border: 0; background: var(--bg-dark); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">proj7k // 控制台</div>
    <nav class="nav" id="nav">
      <a href="#home" data-page="home">主页</a>
      <a href="#history" data-page="history">游玩记录</a>
      <a href="#library" data-page="library">曲库</a>
      <span class="sep"></span>
      <a href="#live" data-page="live">实时雷达</a>
      <a href="#profiler" data-page="profiler">回放与画像</a>
      <a href="#downscaler" data-page="downscaler">降阶练习</a>
      <a href="#generator" data-page="generator">谱面生成</a>
      <a href="#sync" data-page="sync">曲库同步</a>
    </nav>
    <div class="status">
      <select id="playerSel" class="hidden" title="看哪位玩家的主页和记录"></select>
      <span id="gameState" class="game-state" title="osu!lazer 里当前选中的谱面"></span>
      <span id="lazerState" title="osu!lazer 数据库状态"></span>
      <button class="small" id="lazerBtn" title="关闭 osu!lazer（和点窗口的 ✕ 一样，游戏会正常保存后退出）再重新打开；没在运行就直接打开">重启 osu!</button>
      <span id="jobState"></span>
      <span><span class="dot" id="connDot"></span><span id="connText">未连接</span></span>
    </div>
  </div>
  <div class="frames" id="frames">
    <div class="drawer-shade hidden" id="shade"></div>
    <div class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <button class="small" id="drawerBack" title="上一个">←</button>
        <span class="grow" id="drawerTitle"></span>
        <button class="small" id="drawerClose" title="关闭（Esc）">✕ 关闭</button>
      </div>
      <iframe id="drawerFrame" title="详情"></iframe>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    "use strict";
    // Each tool is its own page, loaded once and kept alive while hidden: the live radar keeps following the
    // game and a running job keeps streaming while another tab is open.
    const PAGES = {
      home: "/home", history: "/history", library: "/library",
      live: "/live", sync: "/sync", downscaler: "/downscaler", generator: "/generator", profiler: "/profiler",
    };
    const PLAYER_PAGES = ["home", "history", "library"];
    const frames = {};
    const ready = new Set();   // frames whose page has loaded and listens for parameters
    const pending = {};        // page -> parameters waiting for it to load
    let player = "";

    function pageSrc(name) {
      return PLAYER_PAGES.includes(name) && player ? `${PAGES[name]}?player=${encodeURIComponent(player)}` : PAGES[name];
    }
    function show(name, params) {
      if (!(name in PAGES)) name = "home";
      if (!frames[name]) {
        frames[name] = P7.el("iframe", { src: pageSrc(name), title: name });
        document.getElementById("frames").prepend(frames[name]);
      }
      for (const [k, f] of Object.entries(frames)) f.style.visibility = k === name ? "visible" : "hidden";
      document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.page === name));
      document.title = `proj7k · ${document.querySelector(`#nav a[data-page="${name}"]`).textContent}`;
      if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
      if (params && Object.keys(params).length) {
        if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "params", params }, location.origin);
        else pending[name] = params;
      }
    }
    window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    show(location.hash.slice(1));
    // Coming back to the window (from the game) refreshes the page in front: a play just set shows up.
    document.addEventListener("visibilitychange", () => {
      const f = frames[location.hash.slice(1) || "home"];
      if (!document.hidden && f && ready.has(f)) f.contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
    });

    // --- detail panel: a chart or a play, opened from any page ---------------------------------------------------
    const drawer = document.getElementById("drawer");
    const drawerFrame = document.getElementById("drawerFrame");
    const stack = [];
    const DETAIL_TITLE = { chart: "谱面", play: "单局成绩" };
    function openDetail(page, params) {
      const src = `/${page}?${new URLSearchParams({ ...params, ...(player ? { player } : {}) })}`;
      if (stack[stack.length - 1] !== src) stack.push(src);
      loadDetail();
    }
    function loadDetail() {
      const src = stack[stack.length - 1];
      if (!src) return closeDetail();
      drawerFrame.src = src;
      document.getElementById("drawerTitle").textContent = DETAIL_TITLE[src.slice(1).split("?")[0]] || "";
      document.getElementById("drawerBack").disabled = stack.length < 2;
      drawer.classList.remove("hidden");
      document.getElementById("shade").classList.remove("hidden");
    }
    function closeDetail() {
      stack.length = 0;
      drawer.classList.add("hidden");
      document.getElementById("shade").classList.add("hidden");
      drawerFrame.src = "about:blank";
    }
    document.getElementById("drawerClose").onclick = closeDetail;
    document.getElementById("shade").onclick = closeDetail;
    document.getElementById("drawerBack").onclick = () => { stack.pop(); loadDetail(); };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin || !e.data || !e.data.p7) return;
      const msg = e.data;
      if (msg.kind === "ready") {
        const name = Object.keys(frames).find((k) => frames[k].contentWindow === e.source);
        if (!name) return;
        ready.add(frames[name]);
        if (pending[name]) { frames[name].contentWindow.postMessage({ p7: true, kind: "params", params: pending[name] }, location.origin); delete pending[name]; }
      } else if (msg.kind === "nav") {
        closeDetail();
        if (location.hash.slice(1) !== msg.page) history.replaceState(null, "", `#${msg.page}`);
        show(msg.page, msg.params);
      } else if (msg.kind === "detail") {
        openDetail(msg.page, msg.params);
      }
    });
    document.getElementById("gameState").onclick = () => { if (gameMd5) openDetail("chart", { md5: gameMd5 }); };

    // --- whose pages: the library's own player unless another is picked --------------------------------------------
    async function loadPlayers() {
      let data;
      try { data = await P7.getJSON("/api/me/players"); } catch (e) { return; }
      const sel = document.getElementById("playerSel");
      const players = data.players || [];
      sel.replaceChildren(...players.map((p) => P7.el("option", { value: p.name, text: `${p.name}（${p.plays} 局）` })));
      sel.classList.toggle("hidden", players.length < 2);
      player = data.default || "";
      sel.value = player;
    }
    document.getElementById("playerSel").onchange = (e) => {
      player = e.target.value;
      PLAYER_PAGES.forEach((k) => { if (frames[k]) { ready.delete(frames[k]); frames[k].src = pageSrc(k); } });
    };
    loadPlayers();

    P7.on("connection", (up) => {
      document.getElementById("connDot").classList.toggle("on", up);
      document.getElementById("connText").textContent = up ? "已连接" : "未连接";
      if (up) P7.send({ type: "jobs_list" });
    });

    const active = new Map();
    function renderJobs() {
      const running = [...active.values()].filter((j) => j.status === "running").length;
      const queued = [...active.values()].filter((j) => j.status === "queued").length;
      document.getElementById("jobState").textContent =
        running || queued ? `任务：${running} 运行中${queued ? `，${queued} 排队` : ""}` : "";
    }
    P7.on("jobs", (msg) => { active.clear(); msg.jobs.forEach((j) => { if (j.status === "queued" || j.status === "running") active.set(j.id, j); }); renderJobs(); });
    P7.on("job_update", (msg) => {
      const j = msg.job;
      if (j.status === "queued" || j.status === "running") active.set(j.id, j); else active.delete(j.id);
      renderJobs();
      if (!["queued", "running"].includes(j.status) && (j.kind.startsWith("sync") || j.kind === "lazer_control")) refreshLazer();
    });

    // The game's current chart, which the downscaler, generator and profiler pages preselect.
    let gameMd5 = null;
    P7.onGameChart((state) => {
      const node = document.getElementById("gameState");
      const c = state.chart;
      gameMd5 = c ? c.md5_hash : null;
      node.textContent = c ? `♪ ${c.title} [${c.version}] · ${Number(c.star_rating).toFixed(2)}★ ${c.dan_tier || ""}` : "";
      node.title = c ? `osu!lazer 当前谱面：${P7.chartName(c)}（点击查看详情）` : "osu!lazer 里当前选中的谱面";
    });

    async function refreshLazer() {
      const node = document.getElementById("lazerState");
      try {
        const cfg = await P7.getJSON("/api/config");
        node.textContent = !cfg.realm_exists ? "未找到 osu!lazer 数据库"
          : cfg.lazer_running ? "osu!lazer 运行中（数据库锁定）" : "osu!lazer 未运行";
        node.className = !cfg.realm_exists ? "warn" : "";
      } catch (e) { node.textContent = ""; }
    }
    document.getElementById("lazerBtn").onclick = async () => {
      const btn = document.getElementById("lazerBtn");
      const node = document.getElementById("lazerState");
      btn.disabled = true;
      node.textContent = "正在重启 osu!lazer…";
      const job = await P7.startJob("lazer_control", { mode: "restart" });
      btn.disabled = false;
      if (job.status === "failed") alert(`重启 osu!lazer 失败：${job.error}`);
      refreshLazer();
    };

    // Probed on load and after each sync job only: the probe takes osu!lazer's lock for an instant.
    refreshLazer();
  </script>
</body>
</html>
