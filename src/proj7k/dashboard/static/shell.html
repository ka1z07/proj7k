<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj7k 控制台</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    html, body { height: 100%; }
    body { padding: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-dark); }
    .main { flex: 1; display: flex; min-height: 0; position: relative; }
    /* Behind everything: the cover of the chart in the game (or the last one played), blurred and dimmed, with
       osu!-style triangles drifting up over it. Pages are transparent over it; their cards are translucent. */
    .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg-dark); }
    .bd-layer { position: absolute; inset: -40px; background-size: cover; background-position: center; opacity: 0;
      filter: blur(28px) brightness(0.26) saturate(1.2); transform: scale(1.06); transition: opacity 1.2s ease, transform 8s ease; }
    .bd-layer.on { opacity: 1; transform: scale(1); }
    .backdrop::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 0%, rgba(255, 102, 171, 0.10), transparent 60%), linear-gradient(180deg, rgba(24, 20, 29, 0.2), rgba(24, 20, 29, 0.75)); }
    #tri { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    /* The desktop app's own title bar (Tauri, ADR-0037): drag to move, double-click to maximise. */
    .titlebar { height: 34px; flex: none; display: flex; align-items: stretch; background: rgba(14, 11, 18, 0.55); border-bottom: 1px solid var(--border-color); user-select: none; -webkit-user-select: none; }
    .tb-drag { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 0.78rem; color: var(--text-muted); min-width: 0; }
    .tb-drag .ellipsis { min-width: 0; }
    html.mac .tb-drag { padding-left: 84px; }
    .tb-buttons { display: flex; }
    html.mac .tb-buttons { display: none; }
    .tb-buttons button { width: 46px; border: 0; border-radius: 0; background: transparent; padding: 0; display: grid; place-items: center; color: var(--text-muted); }
    .tb-buttons button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 0; }
    .tb-buttons button.close:hover:not(:disabled) { background: #e81123; color: #fff; }
    .tb-buttons button:active:not(:disabled) { transform: none; }
    .tb-buttons svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.2; }
    /* The side bar: the player's pages, then the tools, then the game's state at the foot. */
    .side {
      width: 224px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 12px;
      background: var(--bg-side); border-right: 1px solid var(--border-color); overflow-y: auto;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.02em; }
    .brand .logo {
      width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #8866ee); color: #fff; font-size: 0.8rem; font-weight: 900;
      box-shadow: 0 0 18px rgba(255, 102, 171, 0.35);
    }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav .group { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; padding: 12px 10px 4px; }
    .nav a {
      position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-muted);
      font-weight: 600; padding: 8px 10px; border-radius: 8px;
    }
    .nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav a:hover { color: var(--text-main); background: var(--bg-hover); }
    .nav a.active { color: var(--text-main); background: var(--accent-soft); }
    .nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .nav a.active svg { color: var(--accent); }
    .nav .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
    .game {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem;
    }
    .game-head { display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
    .game-head .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; flex: none; }
    .dot.on { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .dot.warn { background: var(--accent-gold); }
    .dot.off { background: var(--accent-red); }
    .game-state { color: var(--text-main); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .game-state:empty { display: none; }
    #gameState { cursor: pointer; }
    #gameState:hover { color: var(--accent); }
    #jobState:empty { display: none; }
    #jobState { color: var(--accent-blue); }
    .foot-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-muted); padding: 0 4px; }
    .foot-row .grow { flex: 1; }
    #playerSel { padding: 4px 8px; font-size: 0.8rem; }
    .frames { flex: 1; position: relative; min-width: 0; }
    .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    @keyframes p7-page { from { opacity: 0; transform: translateY(12px) scale(0.995); } to { opacity: 1; transform: none; } }
    @keyframes p7-slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes p7-shade { from { opacity: 0; } to { opacity: 1; } }
    .frames iframe.enter { animation: p7-page 0.32s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .drawer:not(.hidden) { animation: p7-slide 0.28s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .drawer-shade:not(.hidden) { animation: p7-shade 0.2s ease-out; }
    .nav a, .nav a svg { transition: background 0.18s, color 0.18s; }
    .nav a.active::before { animation: p7-shade 0.25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .frames iframe.enter, .drawer, .drawer-shade, .nav a.active::before { animation: none !important; } }
    /* A narrow window keeps the icons only; their names show on hover. */
    @media (max-width: 1080px) {
      .side { width: 64px; padding: 14px 8px 10px; align-items: center; }
      .brand { padding: 2px 0 12px; }
      .brand .name, .nav .label, .nav .group, .game, .foot-row .grow, #connText, #playerSel { display: none !important; }
      .nav .group + a { margin-top: 14px; }
      .nav a { padding: 9px; justify-content: center; }
      .nav a.active::before { left: -8px; }
      .foot-row { flex-direction: column; padding: 0; }
      #langBtn { padding: 3px 6px; font-size: 0.7rem; }
    }
    /* Chart and play details open in a panel over the page that opened them, so the list stays where it was. */
    .drawer-shade { position: absolute; inset: 0; background: rgba(8, 6, 12, 0.6); z-index: 10; backdrop-filter: blur(3px); }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(880px, 100%); z-index: 11;
      background: rgba(24, 20, 29, 0.94); border-left: 1px solid var(--border-color); box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px);
      display: flex; flex-direction: column;
    }
    .drawer-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border-color); }
    .drawer-head .grow { flex: 1; color: var(--text-muted); font-size: 0.82rem; }
    .drawer iframe { flex: 1; width: 100%; border: 0; background: transparent; }
    /* A page a job made (a replay viewer) opens over the whole app window rather than in a browser tab. */
    .viewer-shade { position: absolute; inset: 0; z-index: 20; background: rgba(8, 6, 12, 0.7); backdrop-filter: blur(6px); }
    .viewer {
      position: absolute; inset: 10px; z-index: 21; display: flex; flex-direction: column; overflow: hidden;
      background: #090d16; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
    }
    .viewer-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border-color); background: rgba(24, 20, 29, 0.9); }
    .viewer-head .grow { flex: 1; min-width: 0; color: var(--text-muted); font-size: 0.82rem; }
    .viewer iframe { flex: 1; width: 100%; border: 0; background: #090d16; opacity: 0; transition: opacity 0.25s ease-out; }
    .viewer iframe.loaded { opacity: 1; }
    .viewer-spin { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: var(--accent); animation: p7-spin 0.8s linear infinite; pointer-events: none; }
    .viewer iframe.loaded + .viewer-spin { display: none; }
    @keyframes p7-spin { to { transform: rotate(360deg); } }
    @keyframes p7-pop { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes p7-unpop { to { opacity: 0; transform: translateY(12px) scale(0.98); } }
    @keyframes p7-unshade { to { opacity: 0; } }
    .viewer:not(.hidden) { animation: p7-pop 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .viewer-shade:not(.hidden) { animation: p7-shade 0.24s ease-out; }
    .viewer.closing { animation: p7-unpop 0.2s ease-in forwards; }
    .viewer-shade.closing { animation: p7-unshade 0.2s ease-in forwards; }
    @media (prefers-reduced-motion: reduce) { .viewer, .viewer-shade, .viewer iframe { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="bd-layer" id="bdA"></div><div class="bd-layer" id="bdB"></div><canvas id="tri"></canvas></div>
  <header class="titlebar hidden" id="titlebar">
    <div class="tb-drag" id="tbDrag"><span class="ellipsis" id="tbTitle">proj7k</span></div>
    <div class="tb-buttons">
      <button id="tbMin" title="最小化"><svg viewBox="0 0 12 12"><path d="M1 6.5h10"/></svg></button>
      <button id="tbMax" title="最大化"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
      <button id="tbClose" class="close" title="关闭"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
    </div>
  </header>
  <div class="main">
  <aside class="side">
    <div class="brand"><span class="logo">7K</span><span class="name">proj7k</span></div>
    <nav class="nav" id="nav">
      <span class="group">玩家</span>
      <a href="#home" data-page="home" title="主页"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="label">主页</span></a>
      <a href="#history" data-page="history" title="游玩记录"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">游玩记录</span></a>
      <a href="#library" data-page="library" title="曲库"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="label">曲库</span></a>
      <span class="group">工具</span>
      <a href="#live" data-page="live" title="实时雷达"><svg viewBox="0 0 24 24"><path d="M12 3 21 9.5 17.5 20h-11L3 9.5z"/><path d="M12 8l4 3-1.5 5h-5L8 11z"/></svg><span class="label">实时雷达</span></a>
      <a href="#profiler" data-page="profiler" title="回放与画像"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="label" data-en="Replays">回放与画像</span></a>
      <a href="#downscaler" data-page="downscaler" title="降阶练习"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h4"/><path d="M18 5v14m-3-3 3 3 3-3"/></svg><span class="label">降阶练习</span></a>
      <a href="#generator" data-page="generator" title="谱面生成"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg><span class="label" data-en="Generator">谱面生成</span></a>
      <span class="group">设置</span>
      <a href="#sync" data-page="sync" title="曲库同步"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg><span class="label" data-en="Sync">曲库同步</span></a>
    </nav>
    <div class="side-foot">
      <select id="playerSel" class="hidden" title="看哪位玩家的主页和记录"></select>
      <div class="game">
        <div class="game-head"><span class="dot" id="lazerDot"></span><span class="grow" id="lazerState" title="osu!lazer 数据库状态"></span></div>
        <span id="gameState" class="game-state" title="osu!lazer 里当前选中的谱面"></span>
        <span id="jobState"></span>
        <button class="small" id="lazerBtn" title="关闭 osu!lazer（和点窗口的 ✕ 一样，游戏会正常保存后退出）再重新打开；没在运行就直接打开">重启 osu!</button>
      </div>
      <div class="foot-row">
        <span class="dot" id="connDot" title="和看板的连接"></span><span class="grow" id="connText">未连接</span>
        <button class="small" id="langBtn" title="切换语言 / Switch language"></button>
      </div>
    </div>
  </aside>
  <div class="frames" id="frames">
    <div class="drawer-shade hidden" id="shade"></div>
    <div class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <button class="small" id="drawerBack" title="上一个">←</button>
        <span class="grow" id="drawerTitle"></span>
        <button class="small" id="drawerClose" title="关闭（Esc）">✕ 关闭</button>
      </div>
      <iframe id="drawerFrame" title="详情"></iframe>
    </div>
  </div>
  <div class="viewer-shade hidden" id="viewerShade"></div>
  <div class="viewer hidden" id="viewer">
    <div class="viewer-head">
      <span class="grow ellipsis" id="viewerTitle"></span>
      <button class="small" id="viewerExternal" title="在系统浏览器里打开">在浏览器打开</button>
      <button class="small" id="viewerClose" title="关闭（Esc）">✕ 关闭</button>
    </div>
    <iframe id="viewerFrame" title="查看器" allow="autoplay; fullscreen"></iframe>
    <div class="viewer-spin"></div>
  </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
  <script>
    "use strict";
    // Each tool is its own page, loaded once and kept alive while hidden: the live radar keeps following the
    // game and a running job keeps streaming while another tab is open.
    const PAGES = {
      home: "/home", history: "/history", library: "/library",
      live: "/live", sync: "/sync", downscaler: "/downscaler", generator: "/generator", profiler: "/profiler",
    };
    const PLAYER_PAGES = ["home", "history", "library"];
    const frames = {};
    const ready = new Set();   // frames whose page has loaded and listens for parameters
    const pending = {};        // page -> parameters waiting for it to load
    let player = "";
    let current = null;        // the page in front

    function pageSrc(name) {
      return PLAYER_PAGES.includes(name) && player ? `${PAGES[name]}?player=${encodeURIComponent(player)}` : PAGES[name];
    }
    function show(name, params) {
      if (!(name in PAGES)) name = "home";
      if (!frames[name]) {
        frames[name] = P7.el("iframe", { src: pageSrc(name), title: name });
        document.getElementById("frames").prepend(frames[name]);
      }
      for (const [k, f] of Object.entries(frames)) f.style.visibility = k === name ? "visible" : "hidden";
      // The page coming forward fades and slides in; restarting the class replays it on every switch.
      if (name !== current) { const f = frames[name]; f.classList.remove("enter"); void f.offsetWidth; f.classList.add("enter"); current = name; }
      document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.page === name));
      document.title = `proj7k · ${tr(document.querySelector(`#nav a[data-page="${name}"] .label`).textContent)}`;
      document.getElementById("tbTitle").textContent = document.title;
      if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
      if (params && Object.keys(params).length) {
        if (ready.has(frames[name])) frames[name].contentWindow.postMessage({ p7: true, kind: "params", params }, location.origin);
        else pending[name] = params;
      }
    }
    window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    show(location.hash.slice(1));
    // Coming back to the window (from the game) refreshes the page in front: a play just set shows up.
    document.addEventListener("visibilitychange", () => {
      const f = frames[location.hash.slice(1) || "home"];
      if (!document.hidden && f && ready.has(f)) f.contentWindow.postMessage({ p7: true, kind: "shown" }, location.origin);
    });

    // --- detail panel: a chart or a play, opened from any page ---------------------------------------------------
    const drawer = document.getElementById("drawer");
    const drawerFrame = document.getElementById("drawerFrame");
    const stack = [];
    const DETAIL_TITLE = { chart: tr("谱面"), play: tr("单局成绩") };
    function openDetail(page, params) {
      const src = `/${page}?${new URLSearchParams({ ...params, ...(player ? { player } : {}) })}`;
      if (stack[stack.length - 1] !== src) stack.push(src);
      loadDetail();
    }
    function loadDetail() {
      const src = stack[stack.length - 1];
      if (!src) return closeDetail();
      drawerFrame.src = src;
      document.getElementById("drawerTitle").textContent = DETAIL_TITLE[src.slice(1).split("?")[0]] || "";
      document.getElementById("drawerBack").disabled = stack.length < 2;
      drawer.classList.remove("hidden");
      document.getElementById("shade").classList.remove("hidden");
    }
    function closeDetail() {
      stack.length = 0;
      drawer.classList.add("hidden");
      document.getElementById("shade").classList.add("hidden");
      drawerFrame.src = "about:blank";
    }
    document.getElementById("drawerClose").onclick = closeDetail;
    document.getElementById("shade").onclick = closeDetail;
    document.getElementById("drawerBack").onclick = () => { stack.pop(); loadDetail(); };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin || !e.data || !e.data.p7) return;
      const msg = e.data;
      if (msg.kind === "ready") {
        const name = Object.keys(frames).find((k) => frames[k].contentWindow === e.source);
        if (!name) return;
        ready.add(frames[name]);
        if (pending[name]) { frames[name].contentWindow.postMessage({ p7: true, kind: "params", params: pending[name] }, location.origin); delete pending[name]; }
      } else if (msg.kind === "nav") {
        closeDetail();
        if (location.hash.slice(1) !== msg.page) history.replaceState(null, "", `#${msg.page}`);
        show(msg.page, msg.params);
      } else if (msg.kind === "detail") {
        openDetail(msg.page, msg.params);
      }
    });
    document.getElementById("gameState").onclick = () => { if (gameMd5) openDetail("chart", { md5: gameMd5 }); };

    // --- whose pages: the library's own player unless another is picked --------------------------------------------
    async function loadPlayers() {
      let data;
      try { data = await P7.getJSON("/api/me/players"); } catch (e) { return; }
      const sel = document.getElementById("playerSel");
      const players = data.players || [];
      sel.replaceChildren(...players.map((p) => P7.el("option", { value: p.name, text: tr("{name}（{n} 局）", { name: p.name, n: p.plays }) })));
      sel.classList.toggle("hidden", players.length < 2);
      player = data.default || "";
      sel.value = player;
    }
    document.getElementById("playerSel").onchange = (e) => {
      player = e.target.value;
      PLAYER_PAGES.forEach((k) => { if (frames[k]) { ready.delete(frames[k]); frames[k].src = pageSrc(k); } });
    };
    loadPlayers();

    P7.on("connection", (up) => {
      document.getElementById("connDot").className = `dot ${up ? "on" : "off"}`;
      document.getElementById("connText").textContent = up ? tr("已连接") : tr("未连接");
      if (up) P7.send({ type: "jobs_list" });
    });

    const active = new Map();
    function renderJobs() {
      const running = [...active.values()].filter((j) => j.status === "running").length;
      const queued = [...active.values()].filter((j) => j.status === "queued").length;
      document.getElementById("jobState").textContent =
        running || queued ? tr("任务：{n} 运行中", { n: running }) + (queued ? tr("，{n} 排队", { n: queued }) : "") : "";
    }
    P7.on("jobs", (msg) => { active.clear(); msg.jobs.forEach((j) => { if (j.status === "queued" || j.status === "running") active.set(j.id, j); }); renderJobs(); });
    P7.on("job_update", (msg) => {
      const j = msg.job;
      if (j.status === "queued" || j.status === "running") active.set(j.id, j); else active.delete(j.id);
      renderJobs();
      if (!["queued", "running"].includes(j.status) && (j.kind.startsWith("sync") || j.kind === "lazer_control")) refreshLazer();
    });

    // The game's current chart, which the downscaler, generator and profiler pages preselect.
    let gameMd5 = null;
    P7.onGameChart((state) => {
      const node = document.getElementById("gameState");
      const c = state.chart;
      gameMd5 = c ? c.md5_hash : null;
      if (gameMd5) backdrop(gameMd5);
      node.textContent = c ? `♪ ${c.title} [${c.version}] · ${Number(c.star_rating).toFixed(2)}★ ${c.dan_tier || ""}` : "";
      node.title = c ? tr("osu!lazer 当前谱面：{chart}（点击查看详情）", { chart: P7.chartName(c) }) : tr("osu!lazer 里当前选中的谱面");
    });

    async function refreshLazer() {
      const node = document.getElementById("lazerState");
      try {
        const cfg = await P7.getJSON("/api/config");
        node.textContent = !cfg.realm_exists ? tr("未找到 osu!lazer 数据库")
          : cfg.lazer_running ? tr("osu!lazer 运行中（数据库锁定）") : tr("osu!lazer 未运行");
        document.getElementById("lazerDot").className = `dot ${!cfg.realm_exists ? "warn" : cfg.lazer_running ? "on" : ""}`;
      } catch (e) { node.textContent = ""; }
    }
    document.getElementById("lazerBtn").onclick = async () => {
      const btn = document.getElementById("lazerBtn");
      const node = document.getElementById("lazerState");
      btn.disabled = true;
      node.textContent = tr("正在重启 osu!lazer…");
      const job = await P7.startJob("lazer_control", { mode: "restart" });
      btn.disabled = false;
      if (job.status === "failed") alert(tr("重启 osu!lazer 失败：{error}", { error: job.error }));
      refreshLazer();
    };

    // The other language, named in itself; switching reloads the shell and every page in it.
    const langBtn = document.getElementById("langBtn");
    langBtn.textContent = P7I18N.lang === "en" ? "\u4e2d\u6587" : "English";
    langBtn.onclick = () => {
      if (active.size && !confirm(tr("切换语言会重新载入所有页面：正在运行的任务会在后台继续跑完，但页面上不再显示它的进度。继续吗？"))) return;
      P7I18N.remember(P7I18N.lang === "en" ? "zh" : "en");
      location.reload();
    };

    // Probed on load and after each sync job only: the probe takes osu!lazer's lock for an instant.
    refreshLazer();

    // --- the backdrop: the current chart's cover, cross-faded, and drifting triangles -----------------------------
    let bdShown = null, bdFront = "bdA";
    function backdrop(md5) {
      if (!md5 || md5 === bdShown) return;
      bdShown = md5;
      const img = new Image();
      img.onload = () => {
        const back = bdFront === "bdA" ? "bdB" : "bdA";
        const node = document.getElementById(back);
        node.style.backgroundImage = `url("${img.src}")`;
        node.classList.add("on");
        document.getElementById(bdFront).classList.remove("on");
        bdFront = back;
      };
      img.src = P7.coverUrl(md5, 1280);
    }
    P7.getJSON("/api/me/players").then((d) => { if (!bdShown && d.last_md5) backdrop(d.last_md5); }).catch(() => {});

    // osu!'s triangles, rising slowly. ~30 fps, and only while the window has focus: when the game is in front the
    // canvas costs nothing. A system that asks for less motion gets them still.
    (() => {
      const canvas = document.getElementById("tri"), ctx = canvas.getContext("2d");
      const tris = [];
      let w = 0, h = 0, last = 0, running = false;
      const COLORS = ["255,102,171", "136,102,238", "255,255,255", "102,204,255"];
      function size() {
        const dpr = Math.min(1.5, window.devicePixelRatio || 1);
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function spawn(anywhere) {
        const s = 30 + Math.random() * 130;
        return { x: Math.random() * w, y: anywhere ? Math.random() * h : h + s, s, v: 4 + Math.random() * 10 * (60 / s),
                 a: 0.018 + Math.random() * 0.035, c: COLORS[Math.floor(Math.random() * COLORS.length)] };
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const t of tris) {
          ctx.beginPath();
          ctx.moveTo(t.x, t.y - t.s * 0.58); ctx.lineTo(t.x + t.s / 2, t.y + t.s * 0.29); ctx.lineTo(t.x - t.s / 2, t.y + t.s * 0.29);
          ctx.closePath();
          ctx.fillStyle = `rgba(${t.c},${t.a})`;
          ctx.fill();
        }
      }
      function frame(now) {
        if (!running) return;
        const dt = Math.min(0.1, (now - last) / 1000);
        if (dt >= 1 / 30) {
          last = now;
          for (let i = 0; i < tris.length; i++) {
            tris[i].y -= tris[i].v * dt;
            if (tris[i].y < -tris[i].s) tris[i] = spawn(false);
          }
          draw();
        }
        requestAnimationFrame(frame);
      }
      function start() { if (!running && P7.motion && !document.hidden && document.hasFocus()) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
      function stop() { running = false; }
      size();
      for (let i = 0; i < 36; i++) tris.push(spawn(true));
      draw();
      window.addEventListener("resize", () => { size(); draw(); });
      window.addEventListener("focus", start);
      window.addEventListener("blur", stop);
      document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
      start();
    })();

    // --- inside the desktop app (Tauri): the title bar drives the window, web links open in the system browser ------
    const TAURI = window.__TAURI__;
    if (TAURI && TAURI.window) {
      const win = TAURI.window.getCurrentWindow();
      if (/Mac/.test(navigator.platform || navigator.userAgent)) document.documentElement.classList.add("mac");
      document.getElementById("titlebar").classList.remove("hidden");
      document.getElementById("tbDrag").addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (e.detail === 2) win.toggleMaximize(); else win.startDragging();
      });
      document.getElementById("tbMin").onclick = () => win.minimize();
      document.getElementById("tbMax").onclick = () => win.toggleMaximize();
      document.getElementById("tbClose").onclick = () => win.close();
      const maxIcon = async () => {
        const max = await win.isMaximized();
        document.getElementById("tbMax").title = max ? tr("还原") : tr("最大化");
        document.querySelector("#tbMax svg").innerHTML = max
          ? '<rect x="1.5" y="3.5" width="7" height="7"/><path d="M3.5 3.5v-2h7v7h-2"/>' : '<rect x="1.5" y="1.5" width="9" height="9"/>';
      };
      win.onResized(maxIcon);
      maxIcon();
    }
    // --- the viewer: a page a job made (a replay viewer, /files/...html) over the whole window -------------------
    const viewer = document.getElementById("viewer"), viewerShade = document.getElementById("viewerShade");
    const viewerFrame = document.getElementById("viewerFrame");
    let viewerUrl = null;
    function openExternal(url) {
      if (TAURI && TAURI.opener) TAURI.opener.openUrl(url); else window.open(url, "_blank", "noopener");
    }
    function openViewer(url, title) {
      viewerUrl = url;
      viewer.classList.remove("closing"); viewerShade.classList.remove("closing");
      viewerFrame.classList.remove("loaded");
      document.getElementById("viewerTitle").textContent = title || decodeURIComponent(url.split("/").pop());
      viewer.classList.remove("hidden"); viewerShade.classList.remove("hidden");
      viewerFrame.src = url;
    }
    viewerFrame.addEventListener("load", () => {
      if (!viewerUrl) return;
      viewerFrame.classList.add("loaded");
      try {
        const doc = viewerFrame.contentDocument;
        const name = (doc.querySelector("h1") || {}).textContent || doc.title;
        if (name) document.getElementById("viewerTitle").textContent = name;
        doc.addEventListener("keydown", (e) => { if (e.key === "Escape") closeViewer(); });
        viewerFrame.contentWindow.focus();                 // its keys (Space, ←→, [ ]) work at once
      } catch (e) { /* not ours */ }
    });
    function closeViewer() {
      if (!viewerUrl) return false;
      viewerUrl = null;
      const done = () => {
        viewer.classList.add("hidden"); viewerShade.classList.add("hidden");
        viewer.classList.remove("closing"); viewerShade.classList.remove("closing");
        viewerFrame.src = "about:blank";                   // stops its audio
      };
      if (P7.motion && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        viewer.classList.add("closing"); viewerShade.classList.add("closing");
        setTimeout(done, 200);
      } else done();
      return true;
    }
    document.getElementById("viewerClose").onclick = closeViewer;
    viewerShade.onclick = closeViewer;
    document.getElementById("viewerExternal").onclick = () => { if (viewerUrl) { openExternal(new URL(viewerUrl, location.href).href); closeViewer(); } };
    // Esc closes the viewer first, and only the viewer
    window.addEventListener("keydown", (e) => { if (e.key === "Escape" && closeViewer()) e.stopImmediatePropagation(); }, true);

    // Links meant for a new tab: a page a job made opens in the viewer above; anything else (osu! pages, the
    // catalog) opens in the system browser inside the desktop app, which has no tabs. Pages run in frames of this
    // same origin, so one listener per frame covers them all.
    function externalLinks(doc) {
      doc.addEventListener("click", (e) => {
        const a = e.target.closest && e.target.closest("a[target=_blank]");
        if (!a) return;
        const url = new URL(a.getAttribute("href"), location.href);
        if (url.origin === location.origin && /^\/files\/.+\.html?$/i.test(url.pathname)) {
          e.preventDefault();
          const row = a.closest(".artifact");
          const label = row && row.querySelector(".badge");
          openViewer(url.pathname + url.search + url.hash, label ? label.textContent : "");
          return;
        }
        if (!TAURI || !TAURI.opener) return;
        e.preventDefault();
        TAURI.opener.openUrl(url.href);
      }, true);
    }
    externalLinks(document);
    function hookFrame(f) {
      if (f.dataset.links || f === viewerFrame) return;
      f.dataset.links = "1";
      const hook = () => { try { externalLinks(f.contentDocument); } catch (e) { /* not ours */ } };
      f.addEventListener("load", hook);
      if (f.contentDocument && f.contentDocument.readyState !== "loading") hook();
    }
    document.querySelectorAll("iframe").forEach(hookFrame);
    new MutationObserver(() => document.querySelectorAll("iframe").forEach(hookFrame)).observe(document.getElementById("frames"), { childList: true });
  </script>
</body>
</html>
