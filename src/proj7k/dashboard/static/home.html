<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj7k 主页</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .page { max-width: 1320px; }
    /* Two columns: what happened (curve, plays) on the left, what to do about it on the right. */
    .home-cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
    .home-cols > div { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 1100px) { .home-cols { grid-template-columns: 1fr; } }
    .level { text-align: right; min-width: 200px; }
    .level .dan { font-size: 2.6rem; font-weight: 900; line-height: 1; letter-spacing: -0.01em; }
    .level .sr { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin-top: 4px; }
    .level .why { color: #c3cad6; font-size: 0.82rem; margin-top: 4px; }
    .strip { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    @media (max-width: 1200px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tile { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; min-width: 0; }
    .tile .k { color: var(--text-muted); font-size: 0.76rem; }
    .tile .v { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .s { color: var(--text-muted); font-size: 0.76rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .ranks { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .next-card { border-color: rgba(255, 102, 171, 0.35); background: linear-gradient(180deg, rgba(255, 102, 171, 0.08), transparent 60%), var(--bg-card); }
    .step { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--border-color); }
    .step:first-of-type { border-top: 0; padding-top: 0; }
    .step .t { font-weight: 700; }
    .mini { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
    .mini:hover { background: var(--bg-hover); }
    .mini .grow { flex: 1; min-width: 0; }
    .mini .cover.thumb { width: 52px; height: 30px; }
    .dan-grid { display: grid; gap: 6px; grid-template-columns: repeat(5, 1fr); }
    .dan-cell { background: var(--bg-raised); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; border: 1px solid transparent; }
    .dan-cell:hover { border-color: var(--text-dim); }
    .dan-cell.here { border-color: var(--accent); background: var(--accent-soft); }
    .dan-cell .n { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .dan-cell.empty-dan { opacity: 0.45; }
    .online { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .online:empty { display: none; }
    .online .chip { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border-color); border-radius: 999px; padding: 3px 10px; font-size: 0.82rem; }
    .online .chip b { font-weight: 800; }
    .online .chip.lead { border-color: rgba(255, 102, 171, 0.5); }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="empty" id="loading">正在读取 osu!lazer 的游玩记录…</div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
  <script>
    "use strict";
    const { el, $ } = P7;
    let data = null;
    // Numbers count up the first time the page is drawn; a refresh (back from the game) shows them as they are.
    let drawn = false;
    const num = (value, fmt) => (drawn ? el("span", { text: fmt(value) }) : P7.counter(value, fmt));

    // --- pieces -----------------------------------------------------------------------------------------------
    function hero(d) {
      const pl = d.player, prof = d.profile && d.profile.all_time, t = d.totals, lv = d.level;
      const avatar = pl.avatar ? el("img", { class: "avatar", src: pl.avatar, alt: "", onerror: (e) => e.target.replaceWith(el("div", { class: "avatar" })) }) : el("div", { class: "avatar" });
      const lastCover = d.recent_plays[0];
      // The level is the page's headline: the profiler's when replays were read, else a rough one from the clears.
      const level = el("div", { class: "level" },
        el("div", { class: "hint", text: lv && lv.source === "profile" ? tr("当前水平（回放画像）") : tr("当前水平（按通关估算）") }),
        el("div", { class: "dan", text: lv ? lv.dan : "—" }),
        lv ? el("div", { class: "sr" }, num(lv.stars, (x) => `${x.toFixed(2)}★`)) : null,
        prof ? el("div", { class: "why", text: tr("擅长 {a} · 短板 {b}", { a: P7.skillName(prof.dominant), b: P7.skillName(prof.bottleneck) }) })
          : el("div", { class: "why", text: tr("导入回放后按八项技法细算") }));
      return el("div", { class: "hero" },
        lastCover ? P7.cover(lastCover.md5, lastCover.has_cover, 1280) : null,
        el("div", { class: "hero-body", style: "align-items:center" }, avatar,
          el("div", { style: "flex:1;min-width:220px" },
            el("div", { class: "hero-title", text: pl.name }),
            el("div", { class: "hero-sub" },
              pl.country ? `${flag(pl.country)} ${pl.country} · ` : "",
              t.first_play ? tr("{date} 开始记录", { date: new Date(t.first_play).toLocaleDateString(P7I18N.locale) }) + " · " : "",
              t.last_play ? tr("最近游玩 {when}", { when: P7.ago(t.last_play) }) : tr("还没有游玩记录")),
            onlineLine(pl),
            el("div", { class: "actions", style: "margin-top:10px" },
              el("button", { class: "small", text: tr("完整画像"), onclick: () => P7.navigate("profiler", { tab: "player" }) }),
              pl.profile_url ? el("a", { href: pl.profile_url, target: "_blank", rel: "noopener" }, el("button", { class: "small", text: tr("osu! 官网主页") })) : null)),
          level));
    }

    // osu!'s own rank and pp for this player (ADR-0041): asked after the page is drawn, so an offline machine
    // never holds the home page up; nothing is shown when osu! can't be reached.
    let online = { id: null, data: null };
    function onlineLine(pl) {
      const box = el("div", { class: "online" });
      const fill = (o) => {
        if (!o || !o.available) { box.replaceChildren(); return; }
        const p = o.profile, m = p.mania || {}, v7 = (p.variants || {})["7k"] || {};
        const rank = (r) => (r ? `#${P7.num(r)}` : "—");
        const pp = (x) => (x ? `${P7.num(Math.round(x))}pp` : "—");
        const chip = (label, value, cls) => el("span", { class: `chip ${cls || ""}` }, `${label} `, el("b", { text: value }));
        box.replaceChildren(
          chip(tr("7K 全球"), rank(v7.global_rank), "lead"),
          chip(tr("7K 国内"), rank(v7.country_rank)),
          chip("7K", pp(v7.pp)),
          chip(tr("mania 全球"), rank(m.global_rank)),
          chip("mania", pp(m.pp)));
        box.title = tr("osu! 官网数据，每 10 分钟更新");
      };
      if (!(pl.user_id > 0)) return box;
      if (online.id === pl.user_id && online.data) fill(online.data);
      P7.api(`online/${pl.user_id}`).then((o) => { online = { id: pl.user_id, data: o }; fill(o); }).catch(() => {});
      return box;
    }

    function flag(cc) {
      if (!/^[A-Z]{2}$/.test(cc || "")) return "";
      return String.fromCodePoint(...[...cc].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
    }

    // The numbers worth a glance, each with how the last 30 days compare with the 30 before.
    function strip(d) {
      const t = d.totals, r = d.recent, p = d.previous;
      function delta(a, b, fmt, better = 1) {
        if (a === null || b === null || a === undefined || b === undefined) return null;
        const x = a - b;
        if (Math.abs(x) < 1e-9) return el("span", { class: "muted", text: " ±0" });
        return el("span", { class: x * better > 0 ? "good" : "bad", text: ` ${x > 0 ? "+" : "−"}${fmt(Math.abs(x))}` });
      }
      const pct = (x) => `${(x * 100).toFixed(2)}%`, st = (x) => `${x.toFixed(2)}★`;
      const tile = (k, v, ...sub) => el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "v" }, v), el("div", { class: "s" }, ...sub));
      return el("div", { class: "strip" },
        tile(tr("游玩次数"), num(t.plays, (x) => P7.num(Math.round(x))), tr("近 30 天 {n} 局", { n: r.plays }), delta(r.plays, p.plays, (x) => String(Math.round(x)))),
        tile(tr("游玩时长"), P7.duration(t.play_time_s), tr("{n} 张谱 · 最高 {combo}x", { n: P7.num(t.charts), combo: P7.num(t.max_combo) })),
        tile(tr("准确率（近 30 天）"), r.median_accuracy === null ? "—" : num(r.median_accuracy, pct), tr("中位数"), delta(r.median_accuracy, p.median_accuracy, pct)),
        tile(tr("常打星级（近 30 天）"), r.median_stars === null ? "—" : num(r.median_stars, st), tr("中位数"), delta(r.median_stars, p.median_stars, st)),
        tile(tr("通关最高（近 30 天）"), r.best_stars === null ? "—" : num(r.best_stars, st), tr("比前 30 天"), delta(r.best_stars, p.best_stars, st)),
        el("div", { class: "tile" }, el("div", { class: "k", text: tr("评级（每张谱最好一局）") }),
          el("div", { class: "ranks" }, Object.entries(t.ranks).filter(([, v]) => v).map(([k, v]) => el("span", {}, P7.rankBadge(k), v)))));
    }

    // What to play next: the weakest skill, charts at the level not yet cleared well, and the dan above.
    function nextSteps(d) {
      const card = el("div", { class: "card next-card" }, el("h2", { text: tr("下一步练什么") }));
      const prof = d.profile && d.profile.all_time, nx = d.next || {};
      if (prof) {
        card.append(el("div", { class: "step" },
          el("div", { class: "t", text: tr("补短板：{skill}", { skill: P7.skillName(prof.bottleneck) }) }),
          el("div", { class: "hint", text: tr("八项里最弱的一项，{stars}★。按它出练习谱最见效。", { stars: (prof.skills[prof.bottleneck] || 0).toFixed(2) }) }),
          el("div", { class: "actions" }, el("button", { class: "small primary", text: tr("出短板练习"), onclick: () => P7.navigate("profiler", { tab: "player", recommend: "bottleneck" }) }))));
      } else {
        card.append(el("div", { class: "step" },
          el("div", { class: "t", text: tr("先导入回放") }),
          el("div", { class: "hint", text: tr("读过回放才知道八项技法里哪项最弱。") }),
          el("div", { class: "actions" }, el("button", { class: "small primary", text: tr("去导入回放"), onclick: () => P7.navigate("profiler", { tab: "import" }) }))));
      }
      if (nx.almost && nx.almost.length) {
        card.append(el("div", { class: "step" },
          el("div", { class: "t", text: tr("差一点的谱") }),
          el("div", { class: "hint", text: tr("在你水平附近、最好还没到 A 的谱。") }),
          nx.almost.map((p) => el("div", { class: "mini", onclick: () => P7.openChart(p.md5), title: tr("打开谱面详情") },
            P7.cover(p.md5, p.has_cover, 120, "thumb"),
            el("div", { class: "grow" }, el("div", { class: "ellipsis" }, P7.chartTitle(p)), el("div", { class: "hint ellipsis", text: `[${p.version}]` })),
            el("div", { class: "side", style: "text-align:right" }, P7.rankBadge(p), el("div", { class: "hint", text: P7.stars(p.stars) }))))));
      }
      if (nx.next_dan) {
        const n = nx.next_dan;
        card.append(el("div", { class: "step" },
          el("div", { class: "t", text: tr("冲 {dan}（{stars}★）", { dan: n.dan, stars: n.stars.toFixed(2) }) }),
          el("div", { class: "hint", text: n.charts ? tr("曲库里有 {n} 张，通关 {c} 张，{u} 张还没打过。", { n: n.charts, c: n.cleared, u: n.unplayed }) : tr("曲库里还没有这一段的谱。") }),
          el("div", { class: "actions" },
            n.charts ? el("button", { class: "small", text: tr("看这些谱"), onclick: () => P7.navigate("library", { dan: n.dan }) }) : null,
            el("button", { class: "small", text: tr("生成一张"), onclick: () => P7.navigate("generator", { dan: n.dan }) }))));
      }
      return card;
    }

    function skills(d) {
      const prof = d.profile;
      const card = el("div", { class: "card" }, el("h2", { text: tr("八项技法") }));
      if (!prof || !prof.all_time) {
        card.append(el("p", { class: "hint", text: tr("画像来自回放分析：还没有导入过回放。") }),
          el("button", { class: "small primary", text: tr("去导入回放"), onclick: () => P7.navigate("profiler", { tab: "import" }) }));
        return card;
      }
      card.append(P7.skillBars(prof.all_time.skills, prof.recent ? prof.recent.skills : null),
        el("p", { class: "hint", style: "margin-top:6px", text: prof.recent ? tr("灰条是全部回放的实力，彩条是近 30 天。") : tr("全部回放的实力。") }),
        el("div", { class: "actions", style: "margin-top:6px" },
          el("button", { class: "small", text: tr("发力习惯"), onclick: () => P7.navigate("profiler", { tab: "habits" }) })));
      return card;
    }

    // Every play's stars over time: one dot per play, the dan ladder as reference lines.
    function progression(d) {
      const pts = d.progression;
      const card = el("div", { class: "card" }, el("h2", { text: tr("进步曲线（每局谱面的星级）") }));
      if (pts.length < 2) { card.append(el("div", { class: "hint", text: tr("多打几局就会有曲线。") })); return card; }
      const W = 900, H = 240, L = 10, R = 56, T = 10, B = 24;
      const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
      const smax = Math.max(...pts.map((p) => p.stars)) * 1.06, smin = Math.max(0, Math.min(...pts.map((p) => p.stars)) * 0.9);
      const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
      const y = (s) => T + (1 - (s - smin) / Math.max(0.1, smax - smin)) * (H - T - B);
      const svgNode = P7.svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart-svg", role: "img", "aria-label": tr("每局谱面星级随时间变化") });
      let lastLabel = Infinity;  // tiers close together on the scale keep their line but share a label slot
      d.dan_stars.filter((t) => t.stars >= smin && t.stars <= smax).forEach((t) => {
        svgNode.append(P7.svg("line", { x1: L, x2: W - R, y1: y(t.stars), y2: y(t.stars), stroke: "rgba(255, 255, 255, 0.06)", "stroke-width": 1 }));
        if (lastLabel - y(t.stars) >= 13) { svgNode.append(P7.svg("text", { x: W - R + 4, y: y(t.stars) + 4 }, t.name)); lastLabel = y(t.stars); }
      });
      const ticks = 5;
      for (let i = 0; i <= ticks; i++) {
        const t = t0 + ((t1 - t0) * i) / ticks;
        svgNode.append(P7.svg("text", { x: x(t), y: H - 6, "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle" },
          new Date(t * 1000).toLocaleDateString(P7I18N.locale, { month: "numeric", day: "numeric" })));
      }
      // A rolling median of the last 15 plays reads as the trend through the scatter.
      const med = pts.map((_, i) => { const w = pts.slice(Math.max(0, i - 14), i + 1).map((p) => p.stars).sort((a, b) => a - b); return w[w.length >> 1]; });
      pts.forEach((p) => {
        const dot = P7.svg("circle", { cx: x(p.t), cy: y(p.stars), r: 3.2, fill: p.rank === "F" ? "#7a7089" : "#66ccff", "fill-opacity": 0.5, class: "clickable" });
        dot.addEventListener("mousemove", (e) => P7.tip.show(e, [`${p.stars.toFixed(2)}★ · ${p.rank} · ${(p.accuracy * 100).toFixed(2)}%`, new Date(p.t * 1000).toLocaleString(P7I18N.locale, { hour12: false }), tr("点击查看这局")]));
        dot.addEventListener("mouseleave", P7.tip.hide);
        dot.addEventListener("click", () => P7.openPlay(p.id));
        svgNode.append(dot);
      });
      // The trend on top of the dots it summarises.
      svgNode.append(P7.svg("polyline", { points: pts.map((p, i) => `${x(p.t)},${y(med[i])}`).join(" "), fill: "none", stroke: "#ff66ab", "stroke-width": 2.5, "stroke-linejoin": "round", pathLength: 1, class: drawn ? "" : "draw-in" }));
      card.append(svgNode, el("div", { class: "judge-legend" },
        el("span", {}, el("span", { class: "sw", style: "background:#66ccff" }), tr("一局（点击查看）")),
        el("span", {}, el("span", { class: "sw", style: "background:#ff66ab" }), tr("最近 15 局的中位数")),
        el("span", { class: "muted", text: tr("横线是段位星级") })));
      return card;
    }

    function activity(d) {
      const byDay = Object.fromEntries(d.activity.map((a) => [a.day, a.plays]));
      const max = Math.max(1, ...d.activity.map((a) => a.plays));
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const start = new Date(today); start.setDate(start.getDate() - 7 * 26 + 1 - start.getDay());
      const grid = el("div", { class: "heatmap" });
      for (let dt = new Date(start); dt <= today; dt.setDate(dt.getDate() + 1)) {
        const key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
        const n = byDay[key] || 0;
        const cell = el("div", { style: n ? `background: rgba(102, 204, 255, ${(0.25 + 0.75 * n / max).toFixed(2)})` : "" });
        const label = tr("{day}：{n} 局", { day: key, n });
        cell.addEventListener("mousemove", (e) => P7.tip.show(e, [label]));
        cell.addEventListener("mouseleave", P7.tip.hide);
        grid.append(cell);
      }
      const days = d.activity.length;
      return el("div", { class: "card" }, el("h2", { text: tr("活跃度（近半年）") }), grid,
        el("p", { class: "hint", text: tr("{days} 天有游玩，颜色越亮那天打得越多（最多 {max} 局）。", { days, max }) }));
    }

    // The dan ladder at a glance: how many charts of each dan were cleared; the player's own dan is marked.
    function dans(d) {
      if (!d.dans.length) return null;
      const byDan = Object.fromEntries(d.dans.map((r) => [r.dan, r]));
      const here = d.level && d.level.dan;
      return el("div", { class: "card" }, el("h2", { text: tr("段位进度") }),
        el("div", { class: "dan-grid" }, d.dan_stars.map((t) => {
          const r = byDan[t.name];
          return el("div", {
            class: `dan-cell${t.name === here ? " here" : ""}${r ? "" : " empty-dan"}`, onclick: () => P7.navigate("library", { dan: t.name }),
            title: r ? tr("{dan}：玩过 {n} 张，通关 {p} 张，A 以上 {a} 张，最好 {acc}（点击在曲库里看）", { dan: t.name, n: r.charts, p: r.passed, a: r.a_or_better, acc: P7.acc(r.best_accuracy) })
              : tr("在曲库里看 {dan} 的谱", { dan: t.name }),
          }, el("div", { style: "font-weight:700", text: t.name }), el("div", { class: "n", text: r ? `${r.passed}/${r.charts}` : "—" }));
        })),
        el("p", { class: "hint", style: "margin-top:8px", text: tr("数字是通关/玩过的谱数；变速局按变速后的星级。") }));
    }

    function list(title, plays, more) {
      return el("div", { class: "card" }, el("div", { class: "row", style: "justify-content:space-between" }, el("h2", { text: title }), more),
        plays.length ? plays.map((p) => P7.playRow(p)) : el("div", { class: "hint", text: tr("还没有。") }));
    }

    function nowPlaying(state) {
      const c = state.chart;
      if (!c) return el("div", { class: "card hidden" });
      return el("div", { class: "card" }, el("h2", { text: tr("游戏里选中的谱") }), P7.gameChartLine(state),
        el("div", { class: "actions", style: "margin-top:8px" },
          el("button", { class: "small primary", text: tr("谱面详情"), onclick: () => P7.openChart(c.md5_hash) }),
          el("button", { class: "small", text: tr("实时雷达"), onclick: () => P7.navigate("live") }),
          el("button", { class: "small", text: tr("降一阶练习"), onclick: () => P7.navigate("downscaler", { md5: c.md5_hash }) }),
          el("button", { class: "small", text: tr("诊断最近一局"), onclick: () => P7.navigate("profiler", { tab: "replay", source: "current" }) })));
    }
    let nowCard = el("div", { class: "card hidden" });
    P7.onGameChart((state) => { const n = nowPlaying(state); nowCard.replaceWith(n); nowCard = n; });

    function render(d) {
      if (d.error && !d.totals.plays) {
        $("#page").replaceChildren(el("div", { class: "card" }, el("h2", { text: tr("读不到游玩记录") }), el("p", { class: "warn", text: d.error }),
          el("p", { class: "hint", text: tr("主页读的是 osu!lazer 自己的数据库（只读）。确认 osu!lazer 装在默认位置，或在「曲库同步」里看数据库路径。") })));
        return;
      }
      $("#page").replaceChildren(hero(d), strip(d), nowCard,
        el("div", { class: "home-cols" },
          el("div", {}, progression(d),
            list(tr("最近游玩"), d.recent_plays.slice(0, 8), el("button", { class: "small", text: tr("全部记录 →"), onclick: () => P7.navigate("history") })),
            list(tr("最难的通关"), d.top_plays, null)),
          el("div", {}, nextSteps(d), skills(d), dans(d), activity(d))));
    }

    async function load() {
      try {
        data = await P7.api("overview");
        render(data);
        drawn = true;
      } catch (e) {
        $("#page").replaceChildren(el("div", { class: "empty", text: tr("读取失败：{error}", { error: e }) }));
      }
    }
    load();
    // A play just set in the game shows up when the page is looked at again.
    P7.onShown(load);
  </script>
</body>
</html>
