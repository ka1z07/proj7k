<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>proj7k Replay Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d16;
    --card: #121826;
    --card-2: #0e1420;
    --border: #242f48;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --gold: #f59e0b;
    --red: #ef4444;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 12px 14px; display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; margin-bottom: 10px; flex: none; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .chip b { color: var(--text); font-weight: 600; }
  /* one screen: the playfields and the timeline share the left column, the panels scroll on the right */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
  .viewcol { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .stage-wrap { position: relative; flex: 1; min-height: 320px; overflow: hidden; background: #05070c; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; pointer-events: none; font-family: var(--mono); text-shadow: 0 1px 3px #000; }
  .hud.tl { top: 10px; left: 12px; font-size: 13px; line-height: 1.55; }
  .hud.tl .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .hud.tr { top: 10px; right: 12px; text-align: right; font-size: 13px; line-height: 1.55; }
  .hud .j { display: inline-block; min-width: 3.2em; }
  .gauge { display: inline-block; width: 90px; height: 7px; background: #222c42; border-radius: 4px; vertical-align: middle; overflow: hidden; margin-left: 6px; }
  .gauge i { display: block; height: 100%; width: 0; background: var(--accent); }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .side section { padding: 10px 12px; }
  .side h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .skill { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
  .skill .sw { width: 10px; height: 10px; border-radius: 3px; }
  .skill .val { font-family: var(--mono); color: var(--muted); }
  .skill .val b { color: var(--text); }
  .skill.off { opacity: .4; }
  .skill .bd { color: var(--red); font-size: 11px; margin-left: 4px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .row:hover, .row:focus-visible { background: #1b2336; outline: none; }
  .row .t { font-family: var(--mono); color: var(--muted); min-width: 4.4em; }
  .row .tag { margin-left: auto; font-family: var(--mono); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
  .list { max-height: 210px; overflow: auto; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  .seg button { background: transparent; border: 0; padding: 3px 9px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #1b2a44; color: var(--text); }
  .timeline-card { flex: none; padding: 8px 12px 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .btn { background: #1b2336; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; min-height: 28px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #123452; border-color: #1f5f93; min-width: 70px; }
  .toolbar label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .toolbar input[type=range] { width: 96px; accent-color: var(--accent); }
  .toolbar input[type=number] { width: 60px; background: #0b111d; border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .toolbar select { background: #0b111d; border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .toolbar output { font-family: var(--mono); color: var(--text); min-width: 1.6em; }
  .spacer { flex: 1; }
  .time { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #tlwrap { position: relative; }
  #tl { width: 100%; height: 104px; display: block; touch-action: none; cursor: ew-resize; border-radius: 6px; background: var(--card-2); }
  #tip { position: absolute; pointer-events: none; display: none; background: #05080f; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: var(--mono); white-space: nowrap; z-index: 3; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: 11.5px; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .keys { margin-left: auto; }
  kbd { background: #1b2336; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-family: var(--mono); font-size: 11px; }
  @media (max-width: 920px) {
    body { overflow: auto; height: auto; }
    .main { grid-template-columns: 1fr; }
    .stage-wrap { flex: none; height: 70vh; }
    .side { overflow: visible; }
    .chips { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="sub" id="sub"></span>
  <div class="chips" id="chips"></div>
</header>

<div class="main">
  <div class="viewcol">
    <div class="panel stage-wrap">
      <canvas id="stage" aria-label="The chart and the replay's keystrokes falling side by side"></canvas>
      <div class="hud tl"><div class="big" id="hudCombo">0x</div><div id="hudAcc">100.00%</div><div id="hudCounts"></div></div>
      <div class="hud tr"><div id="hudTime">0:00.0</div><div>demand <b id="hudLoad">–</b><span class="gauge"><i id="hudGauge"></i></span></div><div id="hudSkill" style="color:var(--muted)"></div></div>
    </div>
    <div class="panel timeline-card">
      <div class="toolbar">
        <button class="btn primary" id="play">Play</button>
        <button class="btn" id="prevErr" title="Previous mistake ([)">&#9664; mistake</button>
        <button class="btn" id="nextErr" title="Next mistake (])">mistake &#9654;</button>
        <button class="btn" id="hardest" title="Jump to the hardest section (H)">Hardest</button>
        <label>Speed
          <select id="rate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
        </label>
        <label title="Scroll speed, as osu!lazer counts it (↑ ↓)">Scroll <input type="range" id="scroll" min="5" max="40" step="1" value="24"><output id="scrollOut">24</output></label>
        <label>Skin <select id="skin"></select></label>
        <label title="Outline the chart's notes behind your keystrokes"><input type="checkbox" id="overlay" checked> chart in input</label>
        <label id="offLabel">Audio offset <input type="number" id="offset" value="0" step="1"> ms <button class="btn" id="offAuto" title="Line the music's attacks up with the chart's notes" disabled>Auto</button> <span id="offInfo"></span></label>
        <span class="spacer"></span>
        <span class="time" id="clock">0:00.0 / 0:00.0</span>
      </div>
      <div id="tlwrap"><canvas id="tl" aria-label="Difficulty timeline; drag to seek"></canvas><div id="tip"></div></div>
      <div class="legend" id="legend"><span class="keys" title="Bars are the engine's demand reading (taller is harder), coloured by the skill carrying it; red ticks below are where accuracy was lost. Drag the timeline or scroll the wheel over the playfield to scrub."><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> ±1 s · <kbd>↑</kbd><kbd>↓</kbd> scroll · <kbd>[</kbd><kbd>]</kbd> mistakes · <kbd>H</kbd> hardest</span></div>
    </div>
  </div>
  <aside class="side">
    <section class="panel"><h2>Skill levels</h2><div id="skills"></div></section>
    <section class="panel" id="practice" style="display:none">
      <h2>Practice from here</h2>
      <div class="empty" style="padding:0 0 6px">Three-tier bundle (Recovery · Bridge · Push) from the 15 s around the playhead, made at your level.</div>
      <input id="cmd" readonly aria-label="Practice bundle command" style="width:100%;background:#0b111d;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-family:var(--mono);font-size:11px">
      <div style="display:flex;gap:6px;margin-top:6px"><button class="btn" id="copyCmd">Copy command</button><button class="btn" id="cmdHard">At hardest</button></div>
    </section>
    <section class="panel"><h2>Hardest sections</h2><div class="list" id="hot"></div></section>
    <section class="panel">
      <h2>Mistakes</h2>
      <div class="seg" role="group" aria-label="Mistake filter"><button id="fAll" aria-pressed="true">Bad hits</button><button id="fMiss" aria-pressed="false">Misses</button></div>
      <div class="list" id="mistakes"></div>
    </section>
  </aside>
</div>

<audio id="audio" preload="auto"></audio>

<script>
"use strict";
const P = /*__PAYLOAD__*/null;
if (!P) { document.body.innerHTML = '<p style="padding:24px">No replay data embedded.</p>'; throw new Error("no payload"); }

// ---------- constants ----------
const JN = P.judgments;                        // ["MAX","300","200","100","50","MISS"]
const JCOL = ["#9fe3ff", "#5bb4f5", "#86e072", "#f2c94c", "#f2994a", "#ff5d5d"];
const SKILL_COL = ["#ef6f6c", "#f2a65a", "#f2d675", "#7ccf8e", "#5cc8d6", "#6f9bf0", "#a889f0", "#e68ac8"];
const SKILL_NAME = P.skills.map(s => s.replace("_", " "));
// the classic 7K layout: white blue white yellow white blue white
const LANE_KIND = [0, 1, 0, 2, 0, 1, 0];
// a keystroke as the input field paints it: a good hit in its lane's colour, anything worse in a colour of its own
const PRESS_BAD = { 2: "#7bdc6a", 3: "#ff9f43", 4: "#ff6b3d" };
const GHOST_COL = "#c084fc";
// lazer's scroll speed: a note takes this many ms / speed to fall the full height of the column
const LAZER_TIME_RANGE = 11485;
const SKINS = {
  classic: { label: "Classic", col: 0.054, gap: 1, note: 0.40, key: 1.35, radius: 2, ln: 0.80, shine: true,
             lane: ["#eef2f8", "#4aa6ff", "#ffcc33"], tint: ["rgba(255,255,255,0.02)", "rgba(74,166,255,0.035)", "rgba(255,204,51,0.025)"] },
  bars:    { label: "Bars", col: 0.050, gap: 2, note: 0.30, key: 1.15, radius: 0, ln: 0.86, shine: false,
             lane: ["#e8edf4", "#5aa9ff", "#f7c948"], tint: ["rgba(255,255,255,0.02)", "rgba(90,169,255,0.03)", "rgba(247,201,72,0.022)"] },
  thick:   { label: "Thick", col: 0.062, gap: 0, note: 0.52, key: 1.5, radius: 3, ln: 0.76, shine: true,
             lane: ["#f4f6fa", "#3d8bff", "#ffc61a"], tint: ["rgba(255,255,255,0.025)", "rgba(61,139,255,0.04)", "rgba(255,198,26,0.03)"] },
  compact: { label: "Compact", col: 0.044, gap: 1, note: 0.34, key: 1.25, radius: 1, ln: 0.80, shine: false,
             lane: ["#eef2f8", "#56acff", "#ffd23f"], tint: ["rgba(255,255,255,0.02)", "rgba(86,172,255,0.035)", "rgba(255,210,63,0.025)"] },
};
const DEFAULT_SKIN = "bars";                  // the most legible of the four on dense, fast charts
const RATE = P.meta.rate || 1;
const WIN = P.windows;
const N = P.notes;
const TL = P.timeline;
const DUR = P.duration_ms;

const $ = id => document.getElementById(id);
const fmt = ms => { ms = Math.max(0, ms); const s = ms / 1000; return Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lowerBound = (arr, x, f) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (f(arr[m]) < x) lo = m + 1; else hi = m; } return lo; };
const store = { get(k) { try { return localStorage.getItem("proj7k.replay." + k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem("proj7k.replay." + k, v); } catch (e) {} } };
const FONT = getComputedStyle(document.body).fontFamily;

// ---------- header and static panels ----------
$("title").textContent = P.meta.artist + " – " + P.meta.title;
$("sub").textContent = "[" + P.meta.version + "] by " + P.meta.creator + " · played by " + P.meta.player + (RATE !== 1 ? " · " + (RATE > 1 ? "DT" : "HT") : "");
const S = P.summary;
const chip = (k, v) => { const e = document.createElement("span"); e.className = "chip"; e.innerHTML = k + " <b>" + v + "</b>"; $("chips").appendChild(e); };
chip("★", P.meta.stars.toFixed(2));
if (P.radar.overall_dan) chip("level", P.radar.overall_dan);
chip("acc", (S.accuracy * 100).toFixed(2) + "%");
chip("miss", S.counts.MISS);
chip("ghost taps", S.ghost_taps);
if (!P.meta.hash_matched) chip("beatmap", "hash mismatch");

(function skills() {
  const box = $("skills");
  P.skills.forEach((k, i) => {
    const r = P.radar.skills && P.radar.skills[k];
    const d = document.createElement("div");
    d.className = "skill" + (r && r.tested ? "" : " off");
    d.innerHTML = '<span class="sw" style="background:' + SKILL_COL[i] + '"></span><span>' + SKILL_NAME[i] + '</span>' +
      '<span class="val">' + (r && r.tested ? '<b>' + r.stars.toFixed(2) + '★</b> ' + r.dan + (r.broke_down ? '<span class="bd">broke down</span>' : '') : 'not tested') + '</span>';
    box.appendChild(d);
  });
  const lg = $("legend"), keys = lg.firstElementChild;
  const add = (col, label) => { const s = document.createElement("span"); s.innerHTML = '<i style="background:' + col + '"></i>' + label; lg.insertBefore(s, keys); };
  P.skills.forEach((k, i) => add(SKILL_COL[i], SKILL_NAME[i]));
  add("#ff5d5d", "accuracy lost");
  add(GHOST_COL, "ghost taps");
})();

// ---------- derived data ----------
// judged events in time order: a head is judged when it was pressed (or when its window closed, for a miss)
const missAt = WIN.miss;
const events = [];
N.forEach((n, i) => {
  events.push({ t: n.o != null ? n.t + n.o : n.t + missAt, j: n.j, i, tail: false });
  if (n.e != null && n.tj != null) events.push({ t: n.to != null ? n.e + n.to : n.e + missAt * WIN.tail_scale, j: n.tj, i, tail: true });
});
events.sort((a, b) => a.t - b.t);
// prefix state after each event: judgment counts of heads, combo, max combo
const pre = [];
{
  const c = [0, 0, 0, 0, 0, 0]; let combo = 0, best = 0;
  for (const e of events) {
    if (e.tail) { if (e.j >= 5) combo = 0; }                    // a dropped tail breaks the combo; a late one does not
    else { c[e.j]++; if (e.j >= 4) combo = 0; else combo++; }
    best = Math.max(best, combo);
    pre.push({ c: c.slice(), combo, best });
  }
}
const evTimes = events.map(e => e.t);
const headEvents = events.filter(e => !e.tail), headTimes = headEvents.map(e => e.t);
let maxLN = 0; N.forEach(n => { if (n.e != null) maxLN = Math.max(maxLN, n.e - n.t); });
const isBad = n => n.j >= 3 || (n.tj != null && n.tj >= 4);
const mistakes = N.map((n, i) => ({ n, i })).filter(x => isBad(x.n));
const hotSpots = TL.hot;
const ghosts = P.ghosts.slice().sort((a, b) => a.t - b.t);

// which note each keystroke hit, so the input field can colour it by its judgment (-1: it hit nothing)
const pressJ = P.keys.map(iv => new Int8Array(iv.length).fill(-1));
const pressTail = P.keys.map(iv => new Int8Array(iv.length).fill(-1));
let maxHold = 0;
P.keys.forEach(iv => iv.forEach(([d, u]) => { if (u != null) maxHold = Math.max(maxHold, u - d); }));
N.forEach(n => {
  if (n.o == null) return;
  const iv = P.keys[n.c], at = n.t + n.o;
  let k = lowerBound(iv, at, a => a[0]);
  if (k > 0 && (k === iv.length || Math.abs(iv[k - 1][0] - at) <= Math.abs(iv[k][0] - at))) k--;
  if (k < iv.length && Math.abs(iv[k][0] - at) < 2) { pressJ[n.c][k] = n.j; if (n.tj != null) pressTail[n.c][k] = n.tj; }
});
// the chart's notes per column, for the input field's outline of what was asked
const byCol = [[], [], [], [], [], [], []];
N.forEach(n => byCol[n.c].push(n));

function stateIndex(t) { return lowerBound(evTimes, t + 1e-9, x => x) - 1; }
function stateAt(t) { const k = stateIndex(t); return k >= 0 ? pre[k] : { c: [0, 0, 0, 0, 0, 0], combo: 0, best: 0 }; }
function keyDown(col, t) {
  const iv = P.keys[col];
  let lo = 0, hi = iv.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (iv[m][0] <= t) lo = m + 1; else hi = m; }
  if (lo === 0) return false;
  const up = iv[lo - 1][1];
  return up == null || up > t;
}
// whether the chart asks for the key at t: a head at the line, or an LN still to be held
function chartDown(col, t) {
  const ns = byCol[col];
  const k = lowerBound(ns, t + 40, n => n.t) - 1;
  for (let i = k; i >= 0 && i > k - 3; i--) {
    const n = ns[i];
    if (n.e != null ? (n.t <= t + 40 && n.e >= t) : Math.abs(n.t - t) <= 40) return true;
  }
  return false;
}
function binAt(t) { return clamp(Math.floor(t / TL.bin_ms), 0, TL.load.length - 1); }

// ---------- clock ----------
// The playhead runs on the frame clock and follows the audio loosely: the media clock ticks coarsely and
// jitters, which at a high scroll speed shows as notes stuttering, so it only steers, it never sets `now` directly.
const audio = $("audio");
let audioOK = false;
if (P.audio) {
  audio.src = encodeURI(P.audio).replace(/#/g, "%23");
  audio.addEventListener("canplay", () => { audioOK = true; });
  audio.addEventListener("error", () => { audioOK = false; $("offLabel").style.display = "none"; });
} else { $("offLabel").style.display = "none"; }
let now = 0, playing = false, userRate = 1, audioOffset = 0, dragging = false, resumeAfterDrag = false;
let baseTs = 0, baseT = 0;                                  // while playing: now = baseT + (ts - baseTs) * speed
const speed = () => userRate * RATE;

// ---------- audio offset ----------
// The page's audio can sit a few ms off the chart (a decoder's priming samples, a mapper's offset). The music's
// attacks are where its notes are, so decode it, mark how sharply its loudness rises each millisecond, and slide that
// against the chart's note times: the lag where the two line up best is how far the audio runs behind the chart.
const OFFSET_SEARCH_MS = 300;                             // lags tried, either way
const OFFSET_MIN_Z = 4;                                   // how far the best lag must stand above the rest to be trusted
let detected = null;                                      // {offset, z} once measured

// how sharply the audio's high end rises in each 1 ms step: the log energy of its first difference against the
// trailing 15 ms, kept where it rises
function onsetEnvelope(buf) {
  const sr = buf.sampleRate, hop = sr / 1000, n = Math.floor(buf.length / hop);
  const chans = []; for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  const L = new Float32Array(n);
  let prev = 0;
  for (let k = 0; k < n; k++) {
    let e = 0;
    const a = Math.floor(k * hop), b = Math.floor((k + 1) * hop);
    for (let i = a; i < b; i++) {
      let x = 0; for (const ch of chans) x += ch[i];
      const d = x - prev; prev = x; e += d * d;
    }
    L[k] = Math.log(1e-9 + e);
  }
  const env = new Float32Array(n);
  let acc = 0; const W = 15;
  for (let k = 0; k < n; k++) {
    if (k >= W) { env[k] = Math.max(0, L[k] - acc / W); acc -= L[k - W]; }
    acc += L[k];
  }
  return env;
}

// the lag (ms, audio after chart) where the envelope best matches the chart's heads, and how much it stands out
function matchOnsets(env, times) {
  const w = new Map();
  for (const t of times) { const k = Math.round(t); w.set(k, (w.get(k) || 0) + 1); }
  const ks = [...w.keys()], ws = ks.map(k => Math.sqrt(w.get(k)));
  const S = OFFSET_SEARCH_MS, score = new Float64Array(2 * S + 1);
  for (let l = -S; l <= S; l++) {
    let s = 0;
    for (let i = 0; i < ks.length; i++) { const j = ks[i] + l; if (j >= 1 && j < env.length - 1) s += ws[i] * (env[j - 1] + env[j] + env[j + 1]); }
    score[l + S] = s;
  }
  let best = 0; for (let i = 1; i < score.length; i++) if (score[i] > score[best]) best = i;
  const sorted = Array.from(score).sort((a, b) => a - b), med = sorted[sorted.length >> 1];
  const mad = sorted.reduce((a, x) => a + Math.abs(x - med), 0) / sorted.length || 1e-9;
  // refine between the 1 ms steps
  let frac = 0;
  if (best > 0 && best < score.length - 1) { const a = score[best - 1], b = score[best], c = score[best + 1], den = a - 2 * b + c; if (den < 0) frac = 0.5 * (a - c) / den; }
  return { lag: best - S + frac, z: (score[best] - med) / mad };
}

async function detectOffset() {
  $("offInfo").textContent = "measuring…";
  try {
    const res = await fetch(audio.src);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const buf = await new Ctx(1, 1, 44100).decodeAudioData(await res.arrayBuffer());
    const m = matchOnsets(onsetEnvelope(buf), N.map(n => n.t));
    detected = { offset: Math.round(-m.lag), z: m.z };
    $("offAuto").disabled = false;
    if (m.z >= OFFSET_MIN_Z) applyOffset(detected.offset, true);
    else $("offInfo").textContent = "auto: unsure (" + (detected.offset > 0 ? "+" : "") + detected.offset + " ms?)";
  } catch (e) {
    // a page opened straight from disk can play its audio but not read it
    $("offInfo").textContent = "";
  }
}
function applyOffset(v, auto) {
  audioOffset = v; $("offset").value = v; seek(now);
  $("offInfo").textContent = auto ? "auto" : "";
}

function setRate() { audio.playbackRate = userRate * RATE; audio.preservesPitch = false; }
function rebase(t) { baseT = t; baseTs = performance.now(); }
function seek(t) {
  now = clamp(t, 0, DUR);
  rebase(now);
  if (audioOK) { try { audio.currentTime = Math.max(0, (now - audioOffset) / 1000); } catch (e) {} }
  needDraw = true;
}
function play() {
  if (now >= DUR - 50) seek(0);
  playing = true; rebase(now); $("play").textContent = "Pause";
  if (audioOK) { setRate(); audio.currentTime = Math.max(0, (now - audioOffset) / 1000); audio.play().catch(() => { audioOK = false; }); }
}
function pause() { playing = false; $("play").textContent = "Play"; if (audioOK) audio.pause(); }
const toggle = () => playing ? pause() : play();

// ---------- stage ----------
const stage = $("stage"), sctx = stage.getContext("2d", { alpha: false });
let scrollSpeed = clamp(parseFloat(store.get("scroll")) || 24, 5, 40);
let skinName = SKINS[store.get("skin")] ? store.get("skin") : DEFAULT_SKIN;
let overlay = store.get("overlay") !== "0";
let needDraw = true, dpr = 1;
const sizes = new Map();
function measure(cv) {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.max(10, Math.round(r.width * dpr)), h = Math.max(10, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  sizes.set(cv, { w: r.width, h: r.height });
  needDraw = true; tlDirty = true;
}
const sizeOf = cv => sizes.get(cv) || (measure(cv), sizes.get(cv));
const timeRange = () => LAZER_TIME_RANGE / scrollSpeed;
const lead = () => timeRange() * 0.45;                    // a moment we jump to sits a little under halfway up the field

function rrect(ctx, x, y, w, h, r) {
  if (r <= 0 || h < 2 * r || w < 2 * r) { ctx.rect(x, y, w, h); return; }
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// the geometry of both playfields at the current size and skin
function layout(W, H) {
  const sk = SKINS[skinName];
  const bottom = 40;
  let colW = Math.round(clamp(H * sk.col, 20, 70));
  const fit = c => 2 * (7 * c + 6 * sk.gap) + Math.max(30, c * 1.1);
  while (colW > 14 && fit(colW) > W - 24) colW--;
  const fieldW = 7 * colW + 6 * sk.gap, between = Math.max(30, Math.round(colW * 1.1));
  const xL = Math.round((W - (2 * fieldW + between)) / 2), xR = xL + fieldW + between;
  const keyH = Math.round(colW * sk.key);
  const lineY = Math.round(H - bottom - keyH);
  const noteH = Math.max(4, Math.round(colW * sk.note));
  return { sk, colW, fieldW, between, xL, xR, keyH, lineY, noteH, bottom, ppm: lineY / timeRange() };
}

function drawField(ctx, g, x0, H, isInput) {
  const { sk, colW, fieldW, keyH, lineY } = g;
  const colX = c => x0 + c * (colW + sk.gap);
  ctx.fillStyle = "#000"; ctx.fillRect(x0 - 1, 0, fieldW + 2, H - g.bottom + 4);
  for (let c = 0; c < 7; c++) {
    ctx.fillStyle = "#0a0d14"; ctx.fillRect(colX(c), 0, colW, lineY);
    ctx.fillStyle = sk.tint[LANE_KIND[c]]; ctx.fillRect(colX(c), 0, colW, lineY);
  }
  if (sk.gap === 0) {                                      // no gap to separate the columns: a hairline does
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    for (let c = 1; c < 7; c++) ctx.fillRect(Math.round(colX(c)), 0, 1, lineY);
  }
  ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(x0 - 1, 0, 1, H - g.bottom); ctx.fillRect(x0 + fieldW, 0, 1, H - g.bottom);
}

function noteRect(ctx, g, x, y, w, color, alpha) {
  const { sk, noteH } = g;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color; ctx.beginPath(); rrect(ctx, x, y - noteH, w, noteH, sk.radius); ctx.fill();
  if (sk.shine && noteH >= 8) {                            // a lit top edge and a darker foot, as skins draw them
    ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(x + 1, y - noteH + 1, w - 2, Math.max(1, noteH * 0.16));
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(x + 1, y - noteH * 0.3, w - 2, noteH * 0.3 - 1);
  }
  ctx.globalAlpha = 1;
}

function drawKeys(ctx, g, x0, isDown) {
  const { sk, colW, keyH, lineY } = g;
  for (let c = 0; c < 7; c++) {
    const x = x0 + c * (colW + sk.gap), col = sk.lane[LANE_KIND[c]], down = isDown(c);
    if (down) {                                           // the column lights up above a pressed key
      const gr = ctx.createLinearGradient(0, lineY - colW * 4, 0, lineY);
      gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(1, col);
      ctx.globalAlpha = 0.28; ctx.fillStyle = gr; ctx.fillRect(x, lineY - colW * 4, colW, colW * 4); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "#0b0f18"; ctx.fillRect(x, lineY, colW, keyH);
    const pad = Math.max(2, Math.round(colW * 0.1));
    ctx.beginPath(); rrect(ctx, x + pad, lineY + pad + 2, colW - 2 * pad, keyH - 2 * pad - 2, Math.min(6, colW * 0.15));
    if (down) { ctx.fillStyle = col; ctx.fill(); }
    else { ctx.fillStyle = "#151b28"; ctx.fill(); ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1; }
  }
  // the judgment line
  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(x0, lineY - 1, g.fieldW, 2);
}

function drawStage() {
  const { w: W, h: H } = sizeOf(stage);
  const ctx = sctx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#05070c"; ctx.fillRect(0, 0, W, H);
  const g = layout(W, H);
  const { sk, colW, noteH, lineY, ppm } = g;
  const Y = t => lineY - (t - now) * ppm;
  const t0 = now - (H - lineY) / ppm, t1 = now + lineY / ppm + noteH / ppm;
  const lnW = Math.round(colW * sk.ln), lnOff = (colW - lnW) / 2;

  // ---- left: the chart, as the game would show it ----
  drawField(ctx, g, g.xL, H, false);
  ctx.save(); ctx.beginPath(); ctx.rect(g.xL, 0, g.fieldW, lineY + g.keyH); ctx.clip();
  const cx = c => g.xL + c * (colW + sk.gap);
  const lo = lowerBound(N, t0 - maxLN, n => n.t), hi = lowerBound(N, t1, n => n.t);
  for (let i = lo; i < hi; i++) {
    const n = N[i], x = cx(n.c), col = sk.lane[LANE_KIND[n.c]];
    const hitAt = n.o != null ? n.t + n.o : null;
    const hit = hitAt != null && hitAt <= now;              // a hit note is gone from the field the moment it was pressed
    const missed = n.j === 5 && n.t <= now;
    if (n.e != null) {
      const releasedAt = n.to != null ? n.e + n.to : null;
      if (hit && releasedAt != null && releasedAt <= now) continue;
      const held = hit && keyDown(n.c, now);
      const yh = hit ? (held ? lineY : Math.min(lineY, Y(n.t))) : Y(n.t), yt = Y(n.e);
      if (yt > H) continue;
      const dropped = missed || (hit && !held && n.e > now);
      ctx.globalAlpha = dropped ? 0.35 : held ? 0.9 : 0.7;
      ctx.fillStyle = dropped ? "#6b7280" : col;
      ctx.fillRect(x + lnOff, yt, lnW, Math.max(0, yh - yt));
      ctx.globalAlpha = 1;
      noteRect(ctx, g, x, yt + noteH * 0.5, colW, dropped ? "#6b7280" : col, dropped ? 0.5 : 0.95);   // tail cap
      if (!hit || !held) noteRect(ctx, g, x, yh, colW, missed ? "#ff5d5d" : col, missed ? 0.55 : 1);
      continue;
    }
    if (hit) continue;
    const y = Y(n.t);
    if (y - noteH > H) continue;
    noteRect(ctx, g, x, y, colW, missed ? "#ff5d5d" : col, missed ? 0.55 : 1);
  }
  ctx.restore();
  drawKeys(ctx, g, g.xL, c => chartDown(c, now));

  // ---- right: the player's keystrokes, falling on the same clock ----
  drawField(ctx, g, g.xR, H, true);
  ctx.save(); ctx.beginPath(); ctx.rect(g.xR, 0, g.fieldW, lineY + g.keyH); ctx.clip();
  const ix = c => g.xR + c * (colW + sk.gap);
  if (overlay) {                                          // what the chart asked for, outlined behind the keystrokes
    ctx.lineWidth = 1;
    for (let i = lo; i < hi; i++) {
      const n = N[i], y = Y(n.t);
      if (n.t + Math.max(0, n.o || 0) < now - 40) { if (n.e == null || n.e < now) continue; }
      const x = ix(n.c) + 0.5;
      ctx.strokeStyle = n.j === 5 ? "rgba(255,93,93,0.85)" : "rgba(255,255,255,0.13)";
      if (n.e != null) { const yt = Y(n.e); ctx.strokeRect(x + lnOff, yt, lnW - 1, Math.max(0, Math.min(y, lineY) - yt)); }
      if (y <= lineY + noteH) ctx.strokeRect(x, y - noteH + 0.5, colW - 1, noteH - 1);
    }
  }

    const iv = P.keys[c], x = ix(c), col = sk.lane[LANE_KIND[c]];
    for (let k = lowerBound(iv, t0 - maxHold - 1, a => a[0]); k < iv.length; k++) {
      const [d, u0] = iv[k];
      if (d > t1) break;
      const u = u0 == null ? DUR : u0;
      if (u < now) continue;                              // released before the line: gone, like a hit note
      const j = pressJ[c][k];
      const pc = j < 0 ? GHOST_COL : (PRESS_BAD[j] || col);
      const yd = d <= now ? lineY : Y(d), yu = Y(u);
      // the hold: how long the key stayed down

        const tj = pressTail[c][k];
        if (tj >= 0) {                                    // holding an LN: drawn like the chart's LN body
          ctx.globalAlpha = 0.6; ctx.fillStyle = tj >= 4 ? "#ff6b3d" : pc;
          ctx.fillRect(x + lnOff, yu, lnW, yd - yu);

      if (d > now) noteRect(ctx, g, x, yd, colW, pc, 1);

    }
  }
  ctx.restore();
  drawKeys(ctx, g, g.xR, c => keyDown(c, now));

  // judgment flashes on the chart's line, and the last judgment over it
  const lastK = lowerBound(headTimes, now + 1e-9, x => x) - 1;
  for (let k = lastK; k >= 0 && headTimes[k] > now - 160; k--) {
    const e = headEvents[k], n = N[e.i], a = 1 - (now - e.t) / 160;
    const x = cx(n.c);
    const gh = colW * 1.6, gr = ctx.createLinearGradient(0, lineY - gh, 0, lineY);
    gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(1, JCOL[e.j]);
    ctx.globalAlpha = 0.5 * a; ctx.fillStyle = gr; ctx.fillRect(x, lineY - gh, colW, gh);
  }
  ctx.globalAlpha = 1;
  if (lastK >= 0 && now - headTimes[lastK] < 450) {
    const e = headEvents[lastK], a = 1 - (now - headTimes[lastK]) / 450;
    ctx.globalAlpha = clamp(a * 1.6, 0, 1); ctx.fillStyle = JCOL[e.j]; ctx.textAlign = "center";
    ctx.font = "700 " + Math.round(colW * 0.55) + "px " + FONT;
    ctx.fillText(JN[e.j], g.xL + g.fieldW / 2, lineY * 0.62);
    ctx.globalAlpha = 1;
  }
  // ghost taps: a small diamond on the input line
  for (let k = lowerBound(ghosts, now - 250, x => x.t); k < ghosts.length && ghosts[k].t <= now; k++) {
    const gt = ghosts[k], x = ix(gt.c) + colW / 2, y = lineY - noteH, a = 1 - (now - gt.t) / 250;
    ctx.globalAlpha = a; ctx.fillStyle = GHOST_COL; ctx.beginPath();
    ctx.moveTo(x, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // field names, and under the keystrokes a hit-error meter of the last few seconds
  const by = H - g.bottom;
  ctx.font = "600 11px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = "rgba(148,163,184,0.75)";
  ctx.fillText("CHART", g.xL + g.fieldW / 2, by + 26);
  const mw = g.fieldW, mx = g.xR, my = by + 14, half = WIN.miss;
  const px = ms => mx + mw / 2 + (ms / half) * (mw / 2);
  ctx.fillStyle = "#0a0f1a"; ctx.fillRect(mx, my - 6, mw, 12);
  [[WIN.miss, JCOL[4]], [WIN["100"], JCOL[3]], [WIN["200"], JCOL[2]], [WIN["300"], JCOL[1]], [WIN.max, JCOL[0]]].forEach(([wd, col]) => {
    ctx.fillStyle = col; ctx.globalAlpha = 0.22; ctx.fillRect(px(-wd), my - 3, px(wd) - px(-wd), 6);
  });
  ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.fillRect(mx + mw / 2 - 1, my - 6, 2, 12);
  for (let k = lowerBound(headTimes, now - 4000, x => x); k < headEvents.length && headTimes[k] <= now; k++) {
    const n = N[headEvents[k].i]; if (n.o == null) continue;
    ctx.globalAlpha = clamp(1 - (now - headTimes[k]) / 4000, 0.1, 1);
    ctx.fillStyle = JCOL[n.j]; ctx.fillRect(px(clamp(n.o, -half, half)) - 1, my - 6, 2, 12);
  }
  ctx.globalAlpha = 1; ctx.fillStyle = "rgba(148,163,184,0.75)";
  ctx.textAlign = "left"; ctx.fillText("early", mx, by + 34);
  ctx.textAlign = "center"; ctx.fillText("INPUT", mx + mw / 2, by + 34);
  ctx.textAlign = "right"; ctx.fillText("late", mx + mw, by + 34);
}

// the HUD is DOM, so it is only touched when what it shows has changed
const hudLast = {};
function setText(id, v) { if (hudLast[id] !== v) { hudLast[id] = v; $(id).textContent = v; } }
function updateHud() {
  const k = stateIndex(now);
  if (hudLast.k !== k) {
    hudLast.k = k;
    const st = k >= 0 ? pre[k] : { c: [0, 0, 0, 0, 0, 0], combo: 0 };
    const c = st.c, tot = c.reduce((a, b) => a + b, 0);

  }

// ---------- timeline ----------
// Everything but the playhead is drawn once per size into a cached canvas; a frame only blits it.
const tl = $("tl"), tctx = tl.getContext("2d");
const loadMax = Math.max(1.15, ...TL.load);
const riskMax = Math.max(1e-6, ...TL.risk);
const errMax = Math.max(1, ...TL.errors);
const TOP = 6, ERR_H = 22, RULER_H = 14;
const tlCache = document.createElement("canvas");
let tlDirty = true, tlLastPx = -1;

function paintTimeline(W, H) {
  tlCache.width = tl.width; tlCache.height = tl.height;
  const ctx = tlCache.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ph = H - TOP - ERR_H - RULER_H;                 // height of the demand area
  const X = t => (t / DUR) * W;
  const bw = Math.max(1, TL.bin_ms / DUR * W);
  for (let b = 0; b < TL.load.length; b++) {
    const x = X(b * TL.bin_ms), v = clamp(TL.load[b] / loadMax, 0, 1), h = v * ph;
    const sk = TL.skill[b];
    ctx.fillStyle = sk >= 0 ? SKILL_COL[sk] : "#475569";
    ctx.fillRect(x, TOP + ph - h, Math.ceil(bw) - (bw > 3 ? 1 : 0), h);
  }
  // the level the chart is rated at: demand 1.0
  const y1 = TOP + ph - (1 / loadMax) * ph;
  ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(W, y1); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "10px " + FONT; ctx.textAlign = "left";
  ctx.fillText("chart level", 4, y1 - 3);
  // expected losses at the chart's own level: where a player at that level would be dropping notes
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let b = 0; b < TL.risk.length; b++) {
    const x = X((b + 0.5) * TL.bin_ms), y = TOP + ph - (TL.risk[b] / riskMax) * ph * 0.9;
    if (b === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.lineWidth = 1;
  // hardest sections
  hotSpots.forEach((h, k) => {
    ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fillRect(X(h.start), TOP, X(h.end) - X(h.start), ph);
    ctx.strokeStyle = SKILL_COL[h.skill]; ctx.lineWidth = 1.5; ctx.strokeRect(X(h.start) + 0.5, TOP + 0.5, X(h.end) - X(h.start) - 1, ph - 1); ctx.lineWidth = 1;
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.fillText("#" + (k + 1), X(h.start) + 3, TOP + 11);
  });
  // where accuracy was lost, and ghost taps
  const ey = TOP + ph + 2;
  for (let b = 0; b < TL.errors.length; b++) {
    const v = TL.errors[b]; if (v <= 0) continue;
    const h = Math.max(3, (v / errMax) * (ERR_H - 4));
    ctx.fillStyle = "#ff5d5d"; ctx.fillRect(X(b * TL.bin_ms), ey + (ERR_H - 4) - h, Math.ceil(bw) - (bw > 3 ? 1 : 0), h);
  }
  for (let b = 0; b < TL.ghosts.length; b++) if (TL.ghosts[b] > 0) { ctx.fillStyle = GHOST_COL; ctx.fillRect(X((b + 0.5) * TL.bin_ms) - 1.5, ey, 3, 3); }
  if (S.fatal_ms != null) {
    const x = X(S.fatal_ms);
    ctx.strokeStyle = "#ef4444"; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, TOP + ph + ERR_H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#ef4444"; ctx.textAlign = x > W - 60 ? "right" : "left"; ctx.fillText("fatal", x + (x > W - 60 ? -3 : 3), TOP + ph + ERR_H - 4);
  }
  // ruler
  const step = DUR > 360000 ? 60000 : DUR > 120000 ? 30000 : 10000;
  ctx.fillStyle = "rgba(148,163,184,0.8)"; ctx.textAlign = "center";
  for (let t = 0; t <= DUR; t += step) { const x = clamp(X(t), 14, W - 14); ctx.fillText(fmt(t).replace(/\.\d$/, ""), x, H - 3); ctx.fillRect(X(t), TOP + ph + ERR_H, 1, 4); }
  tlDirty = false;
}

function drawTimeline() {
  const { w: W, h: H } = sizeOf(tl);
  const pxDev = Math.round((now / DUR) * W * dpr);
  if (!tlDirty && pxDev === tlLastPx) return;
  if (tlDirty) paintTimeline(W, H);
  tlLastPx = pxDev;
  const ctx = tctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, tl.width, tl.height);
  ctx.drawImage(tlCache, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ph = H - TOP - ERR_H - RULER_H, px = (now / DUR) * W;
  // what is still to come is a little dimmer than what has been played
  ctx.fillStyle = "rgba(14,20,32,0.42)"; ctx.fillRect(px, TOP, W - px, ph);
  ctx.fillStyle = "#fff"; ctx.fillRect(px - 1, 0, 2, TOP + ph + ERR_H);
  ctx.beginPath(); ctx.moveTo(px - 6, 0); ctx.lineTo(px + 6, 0); ctx.lineTo(px, 8); ctx.closePath(); ctx.fill();
}

function timeAtPointer(ev) {
  const r = tl.getBoundingClientRect();
  return clamp((ev.clientX - r.left) / r.width, 0, 1) * DUR;
}
tl.addEventListener("pointerdown", ev => {
  tl.setPointerCapture(ev.pointerId);
  dragging = true; resumeAfterDrag = playing; if (playing) pause();
  seek(timeAtPointer(ev));
});
tl.addEventListener("pointermove", ev => {
  const t = timeAtPointer(ev);
  if (dragging) seek(t);
  const b = binAt(t), sk = TL.skill[b];
  const tip = $("tip");
  tip.style.display = "block";
  tip.innerHTML = fmt(t) + " · demand " + TL.load[b].toFixed(2) + "×" + (sk >= 0 ? " · " + SKILL_NAME[sk] : "") +
    (TL.errors[b] > 0 ? '<br><span style="color:#ff8a8a">accuracy lost ' + TL.errors[b].toFixed(1) + '</span>' : "") + (TL.ghosts[b] ? " · " + TL.ghosts[b] + " ghost tap" + (TL.ghosts[b] > 1 ? "s" : "") : "");
  const r = tl.getBoundingClientRect(), tw = tip.offsetWidth;
  tip.style.left = clamp(ev.clientX - r.left - tw / 2, 0, r.width - tw) + "px";
  tip.style.top = "-34px";
});
tl.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });
const endDrag = () => { if (dragging) { dragging = false; if (resumeAfterDrag) play(); } };
tl.addEventListener("pointerup", endDrag);
tl.addEventListener("pointercancel", endDrag);
// the wheel over the playfield scrubs: a notch moves the chart by an eighth of the field
stage.addEventListener("wheel", ev => { ev.preventDefault(); jump(now + Math.sign(ev.deltaY) * timeRange() / 8); }, { passive: false });

// ---------- sidebar lists and navigation ----------
function jump(t) { seek(t); updateHud(); }
(function hot() {
  const box = $("hot");
  if (!hotSpots.length) { box.innerHTML = '<div class="empty">No section stands out.</div>'; return; }
  hotSpots.forEach((h, k) => {
    const r = document.createElement("div"); r.className = "row"; r.tabIndex = 0;
    r.innerHTML = '<span class="t">' + fmt(h.start) + '</span><span style="color:' + SKILL_COL[h.skill] + '">' + SKILL_NAME[h.skill] + '</span><span class="tag">' + (h.share * 100).toFixed(0) + '% of risk</span>';
    r.onclick = () => jump(h.start - lead());
    r.onkeydown = e => { if (e.key === "Enter") r.onclick(); };
    box.appendChild(r);
  });
})();
let onlyMiss = false;
function renderMistakes() {
  const box = $("mistakes"); box.innerHTML = "";
  const list = mistakes.filter(x => !onlyMiss || x.n.j === 5 || (x.n.tj === 5));
  if (!list.length) { box.innerHTML = '<div class="empty">None. A clean play.</div>'; return; }
  list.slice(0, 400).forEach(x => {
    const n = x.n, r = document.createElement("div"); r.className = "row"; r.tabIndex = 0;
    const tag = n.j >= 3 ? JN[n.j] : "tail " + JN[n.tj];
    const col = n.j >= 3 ? JCOL[n.j] : JCOL[n.tj];
    r.innerHTML = '<span class="t">' + fmt(n.t) + '</span><span>lane ' + (n.c + 1) + (n.e != null ? " LN" : "") + '</span><span class="tag" style="color:' + col + '">' + tag + (n.o != null && n.j >= 3 && n.j < 5 ? " " + (n.o > 0 ? "+" : "") + Math.round(n.o) + "ms" : "") + '</span>';
    r.onclick = () => jump(n.t - lead());
    r.onkeydown = e => { if (e.key === "Enter") r.onclick(); };
    box.appendChild(r);
  });
}
$("fAll").onclick = () => { onlyMiss = false; $("fAll").setAttribute("aria-pressed", "true"); $("fMiss").setAttribute("aria-pressed", "false"); renderMistakes(); };
$("fMiss").onclick = () => { onlyMiss = true; $("fMiss").setAttribute("aria-pressed", "true"); $("fAll").setAttribute("aria-pressed", "false"); renderMistakes(); };
renderMistakes();

function stepMistake(dir) {
  const ts = mistakes.map(x => x.n.t);
  if (!ts.length) return;
  const cur = now + lead();                              // a mistake we jumped to sits `lead` ahead of the line
  let t;
  if (dir > 0) t = ts.find(x => x > cur + 50); else { const before = ts.filter(x => x < cur - 50); t = before.length ? before[before.length - 1] : undefined; }
  if (t !== undefined) jump(t - lead());
}
function hardest() {
  if (!hotSpots.length) return;
  const nextHot = hotSpots.map(h => h.start).sort((a, b) => a - b).find(t => t - lead() > now + 100);
  jump((nextHot !== undefined ? nextHot : hotSpots[0].start) - lead());
}

// ---------- controls ----------
function setScroll(v) {
  scrollSpeed = clamp(Math.round(v), 5, 40);
  $("scroll").value = scrollSpeed; $("scrollOut").textContent = scrollSpeed;
  store.set("scroll", String(scrollSpeed)); needDraw = true;
}
Object.keys(SKINS).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = SKINS[k].label; $("skin").appendChild(o); });
$("skin").value = skinName;
$("skin").onchange = e => { skinName = e.target.value; store.set("skin", skinName); needDraw = true; };
$("overlay").checked = overlay;
$("overlay").onchange = e => { overlay = e.target.checked; store.set("overlay", overlay ? "1" : "0"); needDraw = true; };
setScroll(scrollSpeed);
$("play").onclick = toggle;
$("prevErr").onclick = () => stepMistake(-1);
$("nextErr").onclick = () => stepMistake(1);
$("hardest").onclick = hardest;
$("rate").onchange = e => { userRate = parseFloat(e.target.value); rebase(now); if (audioOK) setRate(); };
$("scroll").oninput = e => setScroll(parseFloat(e.target.value));
$("offset").onchange = e => applyOffset(parseFloat(e.target.value) || 0, false);
$("offAuto").onclick = () => { if (detected) applyOffset(detected.offset, true); };
if (P.audio) setTimeout(detectOffset, 50);
window.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); toggle(); }
  else if (k === "ArrowLeft") { e.preventDefault(); jump(now - (e.shiftKey ? 5000 : 1000)); }
  else if (k === "ArrowRight") { e.preventDefault(); jump(now + (e.shiftKey ? 5000 : 1000)); }
  else if (k === "ArrowUp") { e.preventDefault(); setScroll(scrollSpeed + 1); }
  else if (k === "ArrowDown") { e.preventDefault(); setScroll(scrollSpeed - 1); }
  else if (k === "[") stepMistake(-1);
  else if (k === "]") stepMistake(1);
  else if (k === "h" || k === "H") hardest();
  else if (k === "Home") jump(0);
  else if (k === "End") jump(DUR);
});
if (window.ResizeObserver) { const ro = new ResizeObserver(entries => entries.forEach(en => measure(en.target))); ro.observe(stage); ro.observe(tl); }
window.addEventListener("resize", () => { measure(stage); measure(tl); });

// ---------- main loop ----------
let lastDrawn = -1;
function frame(ts) {
  if (playing && !dragging) {
    let t = baseT + (ts - baseTs) * speed();
    if (audioOK && !audio.paused) {
      const a = audio.currentTime * 1000 + audioOffset, drift = a - t;
      if (Math.abs(drift) > 80) { baseT = a; baseTs = ts; t = a; }    // a real jump (a stall, a seek): follow it
      else baseT += drift * 0.03;                                    // jitter: steer gently toward the audio
    }
    now = t;
    if (now >= DUR) { now = DUR; pause(); }
  }
  if (needDraw || now !== lastDrawn) { drawStage(); drawTimeline(); updateHud(); lastDrawn = now; needDraw = false; }
  requestAnimationFrame(frame);
}
// open a little before the first note, or where #t=<ms> says
now = Math.max(0, (N.length ? N[0].t : 0) - 1500);
{ const m = /[#&]t=(\d+(?:\.\d+)?)/.exec(location.hash); if (m) now = clamp(parseFloat(m[1]), 0, DUR); }   // #t=<ms> opens at a moment
requestAnimationFrame(frame);
window.__replay = { P, seek: jump, play, pause, state: () => ({ now, playing }), setSkin: k => { skinName = k; $("skin").value = k; needDraw = true; }, setScroll, offset: () => ({ audioOffset, detected }), setOverlay: v => { overlay = v; $("overlay").checked = v; needDraw = true; } };   // for scripted checks
</script>
</body>
</html>
