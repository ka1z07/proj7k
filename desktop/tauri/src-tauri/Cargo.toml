[package]
name = "proj7k-desktop"
version = "0.1.0"
description = "proj7k's desktop window over the local dashboard"
edition = "2021"
publish = false

[[bin]]
name = "proj7k"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
